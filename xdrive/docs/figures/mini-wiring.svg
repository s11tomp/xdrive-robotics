<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif" font-size="13" fill="#1f2937">
  <title>MKS XDRIVE Mini connections</title>
  <rect width="800" height="440" fill="#ffffff"/>
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- board -->
  <rect x="290" y="60" width="220" height="300" rx="10" fill="#eef2f7" stroke="#1f2937" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-weight="bold" font-size="15">MKS XDRIVE Mini</text>
  <text x="400" y="106" text-anchor="middle" font-size="12" fill="#4b5563">one motor channel</text>

  <!-- board ports, left -->
  <text x="302" y="155" font-size="12">DC+  DC−</text>
  <text x="302" y="225" font-size="12">Motor A  B  C</text>
  <text x="302" y="295" font-size="12">Brake resistor</text>
  <!-- board ports, right -->
  <text x="498" y="155" text-anchor="end" font-size="12">USB</text>
  <text x="498" y="225" text-anchor="end" font-size="12">J3 CAN (L, H)</text>
  <text x="498" y="295" text-anchor="end" font-size="12">J2 SWD</text>
  <!-- encoder -->
  <rect x="345" y="318" width="110" height="28" rx="4" fill="#ffffff" stroke="#1f2937"/>
  <text x="400" y="337" text-anchor="middle" font-size="12">AS5047 encoder</text>

  <!-- left devices -->
  <rect x="30" y="125" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="115" y="144" text-anchor="middle">DC supply</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#4b5563">current limit set low at first</text>
  <line x1="200" y1="140" x2="290" y2="140" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="200" y1="154" x2="290" y2="154" stroke="#1f2937" stroke-width="2.5"/>

  <rect x="30" y="195" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="115" y="214" text-anchor="middle">Motor</text>
  <text x="115" y="230" text-anchor="middle" font-size="11" fill="#4b5563">any phase order</text>
  <line x1="200" y1="207" x2="290" y2="207" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="217" x2="290" y2="217" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="227" x2="290" y2="227" stroke="#1f2937" stroke-width="2"/>

  <rect x="30" y="265" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="115" y="284" text-anchor="middle">Brake resistor</text>
  <text x="115" y="300" text-anchor="middle" font-size="11" fill="#4b5563">e.g. 2 Ω, 50 W, cooled</text>
  <line x1="200" y1="282" x2="290" y2="282" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="292" x2="290" y2="292" stroke="#1f2937" stroke-width="2"/>

  <!-- magnet link -->
  <path d="M 30 225 H 14 V 332 H 345" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="352" font-size="11" fill="#2563eb">diametric magnet on the rotor shaft,</text>
  <text x="30" y="367" font-size="11" fill="#2563eb">centered under the encoder</text>

  <!-- right devices -->
  <rect x="600" y="125" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="685" y="144" text-anchor="middle">Host computer</text>
  <text x="685" y="160" text-anchor="middle" font-size="11" fill="#4b5563">xdrive/tools, odrivetool</text>
  <line x1="510" y1="147" x2="600" y2="147" stroke="#1f2937" stroke-width="2"/>

  <rect x="600" y="195" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="685" y="214" text-anchor="middle">CAN bus</text>
  <text x="685" y="230" text-anchor="middle" font-size="11" fill="#4b5563">no ground pin: see can.md</text>
  <line x1="510" y1="212" x2="600" y2="212" stroke="#1f2937" stroke-width="2"/>
  <line x1="510" y1="222" x2="600" y2="222" stroke="#1f2937" stroke-width="2"/>

  <rect x="600" y="265" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="685" y="284" text-anchor="middle">ST-Link (optional)</text>
  <text x="685" y="300" text-anchor="middle" font-size="11" fill="#4b5563">recovery and debugging</text>
  <line x1="510" y1="287" x2="600" y2="287" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 3"/>

  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#4b5563">Connections only: positions on the drawing don't match the board. The board powers up from DC, not from USB.</text>
</svg>
