# mypy settings for the host library (tools/xdrive), its tests and the tools that use it; `make test` runs mypy on them.
[mypy]
strict = True
mypy_path = tools

[mypy-usb.*]
ignore_missing_imports = True

# The bench tools: function bodies are checked (property names, value types), annotations are optional.
[mypy-brake_check,calibrate,capture,capture_test,demo,disturb_test,hold_ab,hold_sweep,runin,impedance_test,move_test,move_to,profile_loop,reboot_watch,regen_test,safety_test,sample,set_config,dump_board,spike_hunt,usb_flash,swd_flash,swd_backup]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True
