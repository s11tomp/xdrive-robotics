<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13" fill="#1f2937">
  <title>ST-Link to the Mini's J2 SWD header</title>
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- J2 -->
  <rect x="40" y="40" width="190" height="210" rx="8" fill="#eef2f7" stroke="#1f2937" stroke-width="2"/>
  <text x="135" y="64" text-anchor="middle" font-weight="bold">Mini J2</text>
  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#4b5563">JST-GH 1.25 mm, 5-pin</text>
  <g font-family="monospace" font-size="13">
    <text x="60" y="113">1  3V3</text>
    <text x="60" y="143">2  SWCLK</text>
    <text x="60" y="173">3  GND</text>
    <text x="60" y="203">4  SWDIO</text>
    <text x="60" y="233">5  NRST</text>
  </g>

  <!-- ST-Link -->
  <rect x="410" y="40" width="190" height="210" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="505" y="64" text-anchor="middle" font-weight="bold">ST-Link</text>
  <text x="505" y="80" text-anchor="middle" font-size="11" fill="#4b5563">V2 or clone</text>
  <g font-family="monospace" font-size="13" text-anchor="end">
    <text x="585" y="143">SWCLK</text>
    <text x="585" y="173">GND</text>
    <text x="585" y="203">SWDIO</text>
    <text x="585" y="233">RST</text>
  </g>

  <!-- wires -->
  <line x1="200" y1="139" x2="520" y2="139" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="169" x2="535" y2="169" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="199" x2="520" y2="199" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="229" x2="545" y2="229" stroke="#2563eb" stroke-width="2"/>
  <line x1="190" y1="109" x2="300" y2="109" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="308" y="113" font-size="11" fill="#4b5563">not connected</text>

  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#4b5563">The board runs from its DC bus. NRST lets the probe reach a crashed build (connect under reset).</text>
</svg>
