<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="sans-serif" font-size="13" fill="#1f2937">
  <title>CAN bus topology: one trunk, short stubs, a terminator at each end</title>
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- trunk -->
  <line x1="110" y1="200" x2="830" y2="200" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="110" y1="226" x2="830" y2="226" stroke="#1f2937" stroke-width="2.5"/>
  <text x="840" y="204" font-size="12" fill="#b91c1c">H</text>
  <text x="840" y="230" font-size="12">L</text>
  <text x="470" y="262" text-anchor="middle" font-size="12">trunk: twisted pair, up to about 25 m at 1 Mbit/s</text>

  <!-- terminators -->
  <rect x="96" y="196" width="28" height="34" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="250" text-anchor="middle" font-size="11" fill="#2563eb">120 Ω</text>
  <rect x="806" y="196" width="28" height="34" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="250" text-anchor="middle" font-size="11" fill="#2563eb">120 Ω</text>

  <!-- host adapter -->
  <rect x="40" y="60" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle">USB-CAN adapter</text>
  <text x="110" y="102" text-anchor="middle" font-size="11" fill="#4b5563">its terminator on</text>
  <line x1="104" y1="116" x2="104" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <line x1="116" y1="116" x2="116" y2="226" stroke="#1f2937" stroke-width="2"/>

  <!-- boards -->
  <g>
    <rect x="240" y="60" width="120" height="56" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
    <text x="300" y="84" text-anchor="middle">Mini, node 1</text>
    <text x="300" y="102" text-anchor="middle" font-size="11" fill="#4b5563">J1 open</text>
    <line x1="294" y1="116" x2="294" y2="200" stroke="#b91c1c" stroke-width="2"/>
    <line x1="306" y1="116" x2="306" y2="226" stroke="#1f2937" stroke-width="2"/>
  </g>
  <g>
    <rect x="410" y="60" width="120" height="56" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
    <text x="470" y="84" text-anchor="middle">Mini, node 2</text>
    <text x="470" y="102" text-anchor="middle" font-size="11" fill="#4b5563">J1 open</text>
    <line x1="464" y1="116" x2="464" y2="200" stroke="#b91c1c" stroke-width="2"/>
    <line x1="476" y1="116" x2="476" y2="226" stroke="#1f2937" stroke-width="2"/>
  </g>
  <text x="580" y="92" text-anchor="middle" font-size="18" fill="#4b5563">…</text>
  <g>
    <rect x="640" y="60" width="140" height="56" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
    <text x="710" y="84" text-anchor="middle">Mini, node N</text>
    <text x="710" y="102" text-anchor="middle" font-size="11" fill="#2563eb">last board: J1 fitted</text>
    <line x1="704" y1="116" x2="704" y2="200" stroke="#b91c1c" stroke-width="2"/>
    <line x1="716" y1="116" x2="716" y2="226" stroke="#1f2937" stroke-width="2"/>
  </g>
  <line x1="318" y1="120" x2="318" y2="196" stroke="#4b5563" stroke-width="1"/>
  <text x="324" y="162" font-size="11" fill="#4b5563">stub ≤ 0.3 m</text>
  <text x="470" y="290" text-anchor="middle" font-size="11" fill="#4b5563">The onboard J1 terminator stands in for the far-end resistor; with both ends terminated, H to L measures about 60 Ω with power off.</text>
</svg>
