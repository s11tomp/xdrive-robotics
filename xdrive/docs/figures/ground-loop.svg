<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif" font-size="13" fill="#1f2937">
  <title>Ground loop through a USB host, and the fix</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- left panel: the loop -->
  <text x="220" y="30" text-anchor="middle" font-weight="bold">Ground loop</text>
  <rect x="30" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="90" y="95" text-anchor="middle">DC supply</text>
  <rect x="290" y="60" width="120" height="60" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="95" text-anchor="middle">Mini</text>
  <rect x="290" y="250" width="120" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="278" text-anchor="middle">Host</text>
  <text x="350" y="295" text-anchor="middle" font-size="11" fill="#4b5563">mains-earthed PC</text>

  <!-- power wires with inductance -->
  <line x1="150" y1="75" x2="290" y2="75" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="220" y="68" text-anchor="middle" font-size="11">DC+</text>
  <path d="M 150 105 H 180 q 6 -10 12 0 q 6 -10 12 0 q 6 -10 12 0 q 6 -10 12 0 H 290" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <text x="210" y="142" text-anchor="middle" font-size="11">DC− wire inductance</text>
  <text x="156" y="160" font-size="12" font-weight="bold">V1</text>
  <text x="268" y="160" font-size="12" font-weight="bold">V2</text>
  <line x1="280" y1="118" x2="200" y2="118" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- USB ground and earth path -->
  <line x1="350" y1="120" x2="350" y2="250" stroke="#1f2937" stroke-width="2"/>
  <text x="358" y="190" font-size="11">USB (shares ground)</text>
  <path d="M 90 120 V 340 H 350 V 310" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="220" y="360" text-anchor="middle" font-size="11">supply and host share ground (earth, or the same supply)</text>
  <text x="220" y="382" text-anchor="middle" font-size="11" fill="#b91c1c">return current makes V2 − V1, which drives current through USB</text>

  <!-- right panel: the fix -->
  <text x="680" y="30" text-anchor="middle" font-weight="bold">Isolated USB</text>
  <rect x="490" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="550" y="95" text-anchor="middle">DC supply</text>
  <rect x="750" y="60" width="120" height="60" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="810" y="95" text-anchor="middle">Mini</text>
  <rect x="750" y="250" width="120" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="810" y="285" text-anchor="middle">Host</text>
  <line x1="610" y1="75" x2="750" y2="75" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="610" y1="105" x2="750" y2="105" stroke="#1f2937" stroke-width="2.5"/>
  <text x="680" y="128" text-anchor="middle" font-size="11">short, twisted DC leads</text>
  <line x1="810" y1="120" x2="810" y2="165" stroke="#1f2937" stroke-width="2"/>
  <rect x="760" y="165" width="100" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="810" y="190" text-anchor="middle" font-size="12" fill="#2563eb">USB isolator</text>
  <line x1="810" y1="205" x2="810" y2="250" stroke="#1f2937" stroke-width="2"/>
  <path d="M 550 120 V 340 H 810 V 310" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="680" y="382" text-anchor="middle" font-size="11" fill="#2563eb">no current path through the data connection</text>
</svg>
