---
version:  0.0.1
ns:       com.odriverobotics
summary:  ODrive Interface Definitions

dictionary: [ODrive] # Prevent the word 'ODrive' from being detected as two words 'O' and 'Drive'

userdata:
  c_preamble: |
    #include <tuple>
    using float2D = std::pair<float, float>;
    struct Iph_ABC_t { float phA; float phB; float phC; };

interfaces:
  ODrive:
    c_is_class: True
    brief: Toplevel interface of your ODrive.
    doc: |
      The odrv0, odrv1, ... objects that appear in odrivetool implement this
      toplevel interface.
    attributes:
      error:
        doc: "Board-level errors (bits in `Error`). `clear_errors()` clears them."
        nullflag: NONE
        flags:
          CONTROL_ITERATION_MISSED:
            brief: At least one control iteration was missed.
            doc: |
              The main control loop is supposed to runs at a fixed frequency.
              If the device is computationally overloaded (e.g. too many active
              components) it's possible that one or more control iterations
              are skipped.
          DC_BUS_UNDER_VOLTAGE:
            brief: The DC voltage fell below the limit configured in `config.dc_bus_undervoltage_trip_level`.
            doc: |
              Check that the power leads are connected securely and that the supply
              can deliver the motor's peak current: a supply that sags under load
              trips this error during fast moves at a high current limit. The
              default trip level is 8 V. `tools/sample.py` logs `vbus_voltage`, and
              `tools/capture.py` records it at 8 kHz. Lowering
              `axis0.motor.config.current_lim` or `axis0.controller.config.vel_limit`
              lowers the peak draw.
          DC_BUS_OVER_VOLTAGE:
            brief: The DC voltage exceeded the limit configured in `config.dc_bus_overvoltage_trip_level`.
            doc: |
              Usually regen: a braking motor pushed current back into a supply that
              can't sink it. Enable a brake resistor (`config.enable_brake_resistor`,
              with `config.brake_resistance` set to its value, wiring included), or
              set flux braking or the bus current soft limits
              (`axis0.motor.config.flux_brake_start_voltage`, `I_bus_soft_min`).
              Keep the trip level a few volts above the supply voltage.
          DC_BUS_OVER_REGEN_CURRENT:
            doc: |
              Current flowing back into the power supply exceeded `config.dc_max_negative_current`.
              This happens when the brake resistor is disabled or can't absorb the braking current.

              Check that `config.enable_brake_resistor` is `True` and that
              supply voltage / `config.brake_resistance` exceeds `axis0.motor.config.current_lim` + `current_lim_margin`.
          DC_BUS_OVER_CURRENT:
            doc: |
              Too much current was pulled from the power supply. `ibus` exceeded `config.dc_max_positive_current`.
          BRAKE_DEADTIME_VIOLATION:
            doc: The brake resistor's PWM timings left less than the required dead time between its two FETs. Every motor disarms.
          BRAKE_DUTY_CYCLE_NAN:
            doc: The computed brake duty cycle was not a number (for example from an invalid `vbus_voltage`). Every motor and the brake resistor disarm.
          INVALID_BRAKE_RESISTANCE: {doc: '`config.brake_resistance` is non-positive or NaN. Make sure that `config.brake_resistance` is a positive number.'}
#          BRAKE_RESISTOR_DISARMED:
#            doc: The brake resistor was unexpectedly disarmed.
        
      vbus_voltage:
        type: readonly float32
        unit: V
        brief: Voltage on the DC bus as measured by the ODrive.
      ibus:
        type: readonly float32
        unit: A
        brief: Current on the DC bus as calculated by the ODrive.
        doc: |
          A positive value means that the ODrive is consuming power from the power supply,
          a negative value means that the ODrive is sourcing power to the power supply.

          This value is equal to the sum of the motor currents and the brake resistor currents.
          The motor currents are measured, the brake resistor current is calculated based on
          `config.brake_resistance`.
      ibus_report_filter_k:
          type: float32
          doc: |
            Filter gain for the reported `ibus`. Set to a value below 1.0 to get a smoother
            line when plotting `ibus`. Set to 1.0 to disable. This filter is only applied to
            the reported value and not for internal calculations.
      serial_number: {type: readonly uint64, doc: "The MCU's unique ID, folded to 48 bits. The USB serial number is this value in hex."}
      hw_version_major: {type: readonly uint8, doc: "3 on the MKS XDRIVE Mini, which reports itself as an ODrive v3.6."}
      hw_version_minor: {type: readonly uint8, doc: "6 on the MKS XDRIVE Mini."}
      hw_version_variant: {type: readonly uint8, doc: "The board's voltage variant: 56 on the MKS XDRIVE Mini."}
      fw_version_major: {type: readonly uint8, doc: "Firmware version, major part. Releases of this firmware start at 1.0.0; Makerbase's stock firmware reports 0.0.0."}
      fw_version_minor: {type: readonly uint8, doc: Firmware version, minor part.}
      fw_version_revision: {type: readonly uint8, doc: Firmware version, patch part.}
      fw_version_unreleased:
        type: readonly uint8
        doc: 0 for a build of a release tag, 1 for any other commit or a modified tree (which reports the last release's version).
      brake_resistor_armed: {type: readonly bool, doc: "True while the brake resistor's PWM runs. A system error disarms it; a reboot or `clear_errors()` re-arms it."}
      brake_resistor_saturated: {type: readonly bool, doc: "Latched true once the brake duty cycle reached its 95 % limit: the resistor couldn't absorb all the regen current."}
      brake_resistor_current:
        type: readonly float32
        doc: Commanded brake resistor current
      # Diagnostics & performance monitoring
      n_evt_sampling: {type: readonly uint32, doc: Number of input sampling events since startup (modulo 2^32)}
      n_evt_control_loop: {type: readonly uint32, doc: Number of control loop iterations since startup (modulo 2^32)}
      task_timers_armed:
        type: bool
        doc: |
          Set by a profiling application to trigger sampling of a single
          control iteration. Cleared by the device as soon as the sampling
          is complete.
      task_times:
        c_is_class: False
        attributes:
          sampling: TaskTimer
          control_loop_misc: TaskTimer
          control_loop_checks: TaskTimer
          dc_calib_wait: TaskTimer
          capture_update: TaskTimer
      system_stats:
        c_is_class: False
        attributes:
          uptime: {type: readonly uint32, unit: ms, doc: Time since boot.}
          min_heap_space: {type: readonly uint32, unit: bytes, doc: The smallest free heap seen since boot.}
          max_stack_usage_axis: {type: readonly uint32, unit: bytes, doc: Highest stack use of the axis thread since boot.}
          max_stack_usage_usb: {type: readonly uint32, unit: bytes, doc: Highest stack use of the USB thread since boot.}
          max_stack_usage_uart: {type: readonly uint32, unit: bytes, doc: Highest stack use of the UART thread since boot.}
          max_stack_usage_can: {type: readonly uint32, unit: bytes, doc: Highest stack use of the CAN thread since boot.}
          max_stack_usage_startup: {type: readonly uint32, unit: bytes, doc: Highest stack use of the startup thread.}
          max_stack_usage_analog: {type: readonly uint32, unit: bytes, doc: Highest stack use of the analog-input thread since boot.}
          stack_size_axis: {type: readonly uint32, unit: bytes, doc: Stack size of the axis thread.}
          stack_size_usb: {type: readonly uint32, unit: bytes, doc: Stack size of the USB thread.}
          stack_size_uart: {type: readonly uint32, unit: bytes, doc: Stack size of the UART thread.}
          stack_size_startup: {type: readonly uint32, unit: bytes, doc: Stack size of the startup thread.}
          stack_size_can: {type: readonly uint32, unit: bytes, doc: "Stack size of the CAN thread: 4 KB, as USB's, because CAN endpoint access runs the same handlers."}
          stack_size_analog: {type: readonly uint32, unit: bytes, doc: Stack size of the analog-input thread.}
          prio_axis: {type: readonly int32, doc: FreeRTOS priority of the axis thread.}
          prio_usb: {type: readonly int32, doc: FreeRTOS priority of the USB thread.}
          prio_uart: {type: readonly int32, doc: FreeRTOS priority of the UART thread.}
          prio_startup: {type: readonly int32, doc: FreeRTOS priority of the startup thread.}
          prio_can: {type: readonly int32, doc: FreeRTOS priority of the CAN thread.}
          prio_analog: {type: readonly int32, doc: FreeRTOS priority of the analog-input thread.}
          usb:
            c_is_class: False
            attributes:
              rx_cnt: {type: readonly uint32, doc: USB packets received since boot.}
              tx_cnt: {type: readonly uint32, doc: USB packets sent since boot.}
              tx_overrun_cnt: {type: readonly uint32, doc: USB packets dropped because the transmit buffer was full.}
          i2c:
            c_is_class: False
            attributes:
              addr: {type: readonly uint8, doc: The board's I2C address (I2C shares its pins with CAN; see `config.enable_i2c_a`).}
              addr_match_cnt: {type: readonly uint32, doc: I2C transactions addressed to this board since boot.}
              rx_cnt: {type: readonly uint32, doc: I2C transactions received since boot.}
              error_cnt: {type: readonly uint32, doc: I2C errors since boot.}
      user_config_loaded: {type: readonly uint32, unit: bytes, doc: "Size of the config loaded from flash at boot; 0 when none was loaded (for example after a flash that changed the config layout) and the defaults apply."}
      config_save_failed:
        type: readonly bool
        doc: |
          True when the `save_configuration()` call that caused this boot failed
          to store the config. The board reboots after every save, so after a
          failed one it runs on the config saved before. Any other boot clears it.
      misconfigured:
        # TODO: make this a system error
        type: readonly bool
        doc: |
          True when the config at boot has a problem the board could work around. The board
          still runs, but a feature can be missing. Causes: a GPIO in a mode it doesn't support
          (such as `GPIO_MODE_ENC1`'s number 12, which this firmware doesn't define); a GPIO in a
          mode whose feature isn't enabled (`GPIO_MODE_UART_A` without `config.enable_uart_a`);
          a feature the hardware lacks (`config.enable_uart_c`); or one GPIO used as an interrupt
          input twice (`axis0.config.step_gpio_pin` and an endstop's `gpio_num` on the same GPIO).
          It doesn't catch every misconfiguration.
            
      capture: {type: Capture}
      can: {type: Can}
      test_property: {type: uint32, doc: A scratch value for testing the USB and CAN protocols; it has no effect.}
      otp_valid: {type: readonly bool, doc: True when the MCU's one-time-programmable memory holds a hardware version record.}
      adc1_scan_enabled:
        type: readonly bool
        doc: "Diagnostics: whether ADC1's free-running 16-channel scan (thermistors, GPIO analog inputs) runs. See `set_adc1_scan`."
        
    functions:
      set_adc1_scan:
        in: {enable: bool}
        doc: |
          Diagnostics (RAM only): stop or restart ADC1's free-running regular scan. The bus-voltage
          sample (ADC1 injected, timer-triggered) keeps running. While stopped, thermistor and analog-input
          readings are frozen at their last value.
      test_function: {in: {delta: int32},out: {cnt: int32}, doc: Adds delta to an internal counter and returns it; for testing the protocols.}
      get_adc_voltage: 
        in: {gpio: uint32}
        out: {voltage: float32}
        doc: Reads the ADC voltage of the specified GPIO. The GPIO must be in `GPIO_MODE_ANALOG_IN`.
      save_configuration:
        out: {success: bool}
        doc: |
          Saves the current configuration to non-volatile memory and reboots the
          board, whether or not the store succeeded: check `config_save_failed`
          once it is back up. Returns false without saving or rebooting while the
          motor is armed.
      erase_configuration:
        doc: Resets all `config` variables to their default values and reboots the controller
      reboot:
        doc: Reboots the board without saving the current configuration.
      enter_dfu_mode:
        doc: |
          Resets into the STM32's built-in USB DFU bootloader (USB ID 0483:df11). Use it through
          `tools/usb_flash.py`, which puts the axis in IDLE first and flashes the board.
      enter_can_bootloader:
        out: {success: bool}
        doc: |
          Resets into the CAN bootloader (flash sectors 0-1), which then waits for a firmware update
          over CAN at this board's node ID and bit rate (`tools/can_flash.py`). Returns false
          without resetting while the motor is armed, or when the board has no CAN bootloader.
      get_interrupt_status:
        in: {irqn: {type: int32, doc: '-12...-1: processor interrupts, 0...239: NVIC interrupts'}}
        out:
          status:
            type: uint32
            doc: |
              bit 31:     enabled (1) or disabled (0)
              bits 30:8:  number of times the interrupt fired (modulo 0x800000)
              bits 7:0:   priority (0 is highest priority)
              0xffffffff if the specified number is not a valid interrupt number.
        doc: Returns information about the specified interrupt number.
      get_dma_status:
        in: {stream_num: {type: uint8, doc: '0...7: DMA1 streams, 8...15: DMA2 streams'}}
        out:
          status:
            type: uint32
            doc: |
              bit 31:     zero if the stream's configuration is equal to the reset state
              bits 4:2:   channel
              bits 1:0:   priority (3 is highest priority)
              0xffffffff if the specified number is not a valid DMA stream number.
        doc: Returns information about the specified DMA stream.
      get_gpio_states:
        out: {status: {type: uint32}}
        doc: Returns the logic states of all GPIOs. Bit i represents the state of GPIOi.
      get_drv_fault: {out: {drv_fault: uint32}, doc: "The DRV8301 gate driver's fault status word, read now (0: no fault)."}
      clear_errors:
        doc: Clear all the errors of this device including all contained submodules.

  ODrive.Config:
    c_is_class: False
    attributes:
      enable_uart_a:
        type: bool
        brief: Enables/disables UART_A.
        doc: |
          The GPIOs must be in `GPIO_MODE_UART_A` as well (GPIO1 TX and GPIO2 RX, the default).
          [Hardware](hardware.md#gpios) lists the pins. Takes effect after a save and reboot.
      enable_uart_b:
        type: bool
        brief: Enables/disables UART_B.
        doc: |
          The GPIOs must be in `GPIO_MODE_UART_B` as well (GPIO3 TX and GPIO4 RX).
          [Hardware](hardware.md#gpios) lists the pins. Takes effect after a save and reboot.
      enable_uart_c: {type: bool, doc: Not supported on ODrive v3.x.}
      uart_a_baudrate:
        type: uint32
        unit: baud/s
        brief: Defines the baudrate used on the UART interface.
        doc: |
          The UART clock (42 MHz) gives some rates a small error: 9600 and below are exact,
          19200 to 57600 are off by 0.02 %, 115200 by 0.11 %, 230400 and 460800 by 0.16 %,
          921600 by 0.93 %. The STM32F405 reference manual (RM0090, the USART baud rate tables
          for f_PCLK = 42 MHz) lists every rate.

      uart_b_baudrate:
        type: uint32
        unit: baud/s
        brief: Defines the baudrate used on the UART interface.
        doc: See `uart_a_baudrate` for details.
      uart_c_baudrate: {type: uint32, doc: Not supported on ODrive v3.x.}
      enable_can_a:
        type: bool
        doc: |
          Enables CAN. Changing this setting requires a reboot.
      enable_i2c_a:
        type: bool
        doc: |
          Enables I2C. The I2C pins on ODrive v3.x are in conflict with CAN.
          This setting has no effect if `enable_can_a` is also true.
          This setting has no effect on ODrive v3.2 or earlier.
          Changing this setting requires a reboot.
      usb_cdc_protocol:
        type: StreamProtocolType
        doc: |
          The protocol on the board's USB virtual COM port. The board has a second,
          vendor-specific USB interface that always runs Fibre, which the host tools
          use, so this setting doesn't affect them.
      uart0_protocol: {type: StreamProtocolType, doc: Protocol on UART_A.}
      uart1_protocol: {type: StreamProtocolType, doc: Protocol on UART_B.}
      uart2_protocol: {type: StreamProtocolType, doc: Protocol on UART_C, which ODrive v3.x boards lack.}
      max_regen_current: 
        type: float32
        unit: Amps
        doc: |
          The bus current allowed to flow back to the power supply before the brake resistor starts absorbing current.
          0 (the default) for a supply that can't sink current.
      brake_resistance:
        type: float32
        unit: ohm
        brief: Value of the brake resistor connected to the ODrive.
        doc: |
          Set lower than the true resistance, the board pushes more than
          `max_regen_current` back into the power supply while braking. Set
          higher, it burns more power in the resistor than needed.
      enable_brake_resistor:
        type: bool
        brief: Enable/disable the use of a brake resistor.
        doc: |
          False (the default) with a resistor connected is harmless. True with no
          resistor connected leaves regen nowhere to go but the supply.
          Takes effect after a save and reboot.

      dc_bus_undervoltage_trip_level:
        type: float32
        unit: V
        brief: Minimum voltage below which the motor stops operating.
      dc_bus_overvoltage_trip_level:
        type: float32
        unit: V
        brief: Maximum voltage above which the motor stops operating.
        doc: |
          Every motor disarms above it (`DC_BUS_OVER_VOLTAGE`). The default is 1.07 times the
          board's voltage variant: 59.92 V on the Mini, next to its 60 V parts. Set it a few volts
          above the supply voltage.

      enable_dc_bus_overvoltage_ramp:
        type: bool
        status: experimental
        brief: Enables the DC bus overvoltage ramp feature.
        doc: |
          Above `dc_bus_overvoltage_ramp_start`, the brake duty cycle rises linearly with the
          bus voltage, by 0 % at the start voltage up to 100 % at `dc_bus_overvoltage_ramp_end`,
          on top of the regen current. It works with every motor disarmed, and needs a positive
          `brake_resistance`.
      dc_bus_overvoltage_ramp_start:
        type: float32
        status: experimental
        brief: See `enable_dc_bus_overvoltage_ramp`.
        doc: Set it above the supply voltage; below it, the brake resistor runs continuously.
      dc_bus_overvoltage_ramp_end:
        type: float32
        status: experimental
        brief: See `enable_dc_bus_overvoltage_ramp`.
        doc: Must be larger than `dc_bus_overvoltage_ramp_start`,
          otherwise the ramp feature is disabled.

      dc_max_positive_current:
        type: float32
        unit: A
        brief: Max current the power supply can source.
      dc_max_negative_current:
        type: float32
        unit: A
        brief: Max current the power supply can sink.
        doc: |
          Zero or negative. -inf disables the check. Its magnitude must exceed `max_regen_current`.

      error_gpio_pin: {type: uint32, doc: "GPIO in `GPIO_MODE_STATUS` that signals an error; 0 (the default) for none."}

      gpio3_analog_mapping: {type: Endpoint, c_name: 'analog_mappings[3]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_ANALOG_IN`.}
      gpio4_analog_mapping: {type: Endpoint, c_name: 'analog_mappings[4]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_ANALOG_IN`.}

  ODrive.Can:
    c_is_class: True
    attributes:
      error:
        doc: "CAN errors (bits in `Can.Error`)."
        nullflag: NONE
        flags: {DUPLICATE_CAN_IDS: {doc: Not raised by this firmware.}}
      config:
        c_is_class: False
        attributes:
          baud_rate: {type: uint32, unit: bit/s, c_setter: 'set_baud_rate', doc: "CAN bit rate: a rate that divides 2 MHz evenly, such as 1000000, 500000 or 250000 (the default). Other values are ignored."}
          protocol:
            type: Protocol
            doc: "Protocols on the bus: 1 (`SIMPLE`, CANSimple; the default). 0 turns CAN messaging off. Makerbase's v0.5.1 numbered CANSimple 0, so a config carried over from it needs this set to 1."

  ODrive.Endpoint:
    c_is_class: False
    attributes:
      endpoint: {type: endpoint_ref, doc: The property the input drives (for example `axis0.controller.input_pos`).}
      min: {type: float32, doc: The property's value at the input's lowest level.}
      max: {type: float32, doc: The property's value at the input's highest level.}

  ODrive.Axis:
    c_is_class: True
    attributes:
      error:
        doc: "The axis's errors (bits in `Axis.Error`); also sent in the CAN heartbeat. `MOTOR_FAILED`, `ENCODER_FAILED` and `CONTROLLER_FAILED` point to the sub-object's own `error`."
        nullflag: NONE
        flags:
          INVALID_STATE:
            brief: An invalid state was requested.
            doc: |
              You tried to run a state before you are allowed to. Typically you
              tried to run encoder calibration or closed loop control before the
              motor was calibrated, or you tried to run closed loop control
              before the encoder was calibrated.
          MOTOR_FAILED:
            bit: 6
            doc: Check `motor.error` for more information.
          SENSORLESS_ESTIMATOR_FAILED:
            doc: Check `sensorless_estimator.error` for more information.
          ENCODER_FAILED:
            doc: Check `encoder.error` for more information.
          CONTROLLER_FAILED:
            doc: Check `controller.error` for more information. Set together with a controller fault, such as a following error or a soft limit violation.
          WATCHDOG_TIMER_EXPIRED:
            bit: 11
            brief: The axis watchdog timer expired.
            doc: |
              An amount of time greater than `config.watchdog_timeout` passed
              without the watchdog being fed.
          MIN_ENDSTOP_PRESSED:
            brief: The min endstop was pressed
          MAX_ENDSTOP_PRESSED:
            brief: The max endstop was pressed
          ESTOP_REQUESTED:
            brief: The estop message was sent over CAN
          HOMING_WITHOUT_ENDSTOP:
            bit: 17
            doc: the min endstop was not enabled during homing
          OVER_TEMP:
            # unused
            doc: Check `motor.error` for more details.
          UNKNOWN_POSITION:
            doc: There isn't a valid position estimate available.
      step_dir_active: {type: readonly bool, doc: True while the step/direction input drives `input_pos`.}
      last_drv_fault: {type: readonly uint32, doc: "The gate driver's fault word, latched when the motor last disarmed with `DRV_FAULT`."}
      steps: 
        type: readonly int64
        brief: The current commanded position, in steps, while in `step_dir` mode
      current_state: 
        type: readonly AxisState
        brief: The current state of the axis
      requested_state: 
        type: AxisState
        brief: The user's commanded axis state
        doc: |
          This is used to command the axis to change state or perform certain routines.
          Values input here will be "consumed" and queued by the state machine handler.  Thus, reading this value back will usually show `UNDEFINED` (0).
      is_homed: 
        type: bool
        c_name: homing_.is_homed
        brief: Whether or not the axis has been successfully homed.
      config:
        c_is_class: False
        attributes:
          startup_motor_calibration:
            type: bool
            doc: Run motor calibration at startup, skip otherwise
          startup_encoder_index_search:
            type: bool
            doc: Run encoder index search after startup, skip otherwise this only has an effect if encoder.config.use_index is also true
          startup_encoder_offset_calibration:
            type: bool
            doc: Run encoder offset calibration after startup, skip otherwise
          startup_closed_loop_control:
            type: bool
            doc: Enable closed loop control after calibration/startup
          startup_homing:
            type: bool
            doc: Enable homing after calibration/startup
          enable_step_dir:
            type: bool
            doc: |
              Enable step/dir input after calibration.
              Make sure to set the corresponding GPIO's mode to `GPIO_MODE_DIGITAL`.
          step_dir_always_on:
            type: bool
            doc: |
              Keep step/dir enabled while the motor is disabled.
              This is ignored if enable_step_dir is false.
              This setting only takes effect on a state transition
              into idle or out of closed loop control.
          enable_sensorless_mode: {type: bool, doc: Run closed loop from the sensorless estimator instead of the encoder (untested on the Mini).}
          watchdog_timeout:
            type: float32
            unit: s
            doc: The watchdog expires when nothing feeds it for this long. USB `watchdog_feed()` and every CAN frame addressed to the board feed it.
          enable_watchdog: {type: bool, doc: "Arms the watchdog (default false). `watchdog_action` sets what an expiry does."}
          watchdog_action:
            type: WatchdogAction
            doc: "What the axis does in closed loop when the watchdog expires. Default: `DECEL_HOLD`."
          watchdog_decel:
            type: float32
            unit: turn/s^2
            doc: "Deceleration for `watchdog_action` = `DECEL_HOLD`. Default 10."
          watchdog_torque_lim:
            type: float32
            unit: N·m
            doc: "Torque cap while decelerating and holding after a watchdog timeout. Infinity (the default) keeps the normal limit."
          step_gpio_pin: {type: uint16, c_setter: 'set_step_gpio_pin', doc: "GPIO of the step input; it must be in a `GPIO_MODE_DIGITAL` mode."}
          dir_gpio_pin: {type: uint16, c_setter: 'set_dir_gpio_pin', doc: "GPIO of the direction input; it must be in a `GPIO_MODE_DIGITAL` mode."}
          calibration_lockin: # TODO: this is a subset of lockin state
            c_is_class: False
            attributes:
              current: {type: float32, unit: A, doc: Current of the open-loop vector that turns the rotor during encoder direction search.}
              ramp_time: {type: float32, unit: s, doc: Time to ramp the current up.}
              ramp_distance: {type: float32, unit: rad, doc: Electrical angle covered while the current ramps up.}
              accel: {type: float32, unit: rad/s^2, doc: Electrical acceleration after the ramp.}
              vel: {type: float32, unit: rad/s, doc: Final electrical velocity.}
          sensorless_ramp: LockinConfig
          general_lockin: LockinConfig
          can: CanConfig
      motor: Motor
      controller: Controller
      encoder: Encoder
      acim_estimator: AcimEstimator
      sensorless_estimator: SensorlessEstimator
      trap_traj: TrapezoidalTrajectory
      min_endstop: Endstop
      max_endstop: Endstop
      mechanical_brake: MechanicalBrake
      task_times:
        c_is_class: False
        attributes:
          thermistor_update: TaskTimer
          encoder_update: TaskTimer
          sensorless_estimator_update: TaskTimer
          endstop_update: TaskTimer
          can_heartbeat: TaskTimer
          controller_update: TaskTimer
          open_loop_controller_update: TaskTimer
          acim_estimator_update: TaskTimer
          motor_update: TaskTimer
          current_controller_update: TaskTimer
          dc_calib: TaskTimer
          current_sense: TaskTimer
          pwm_update: TaskTimer
    functions:
      watchdog_feed:
        doc: Feed the watchdog to prevent watchdog timeouts.

  ODrive.Axis.LockinConfig:
    c_is_class: False
    attributes:
      current:
        type: float32
        unit: A
        doc: Current of the open-loop vector that turns the rotor.
      ramp_time:
        type: float32
        unit: s
        doc: Time to ramp the current up at standstill.
      ramp_distance:
        type: float32
        unit: rad
        doc: Electrical angle covered while the current ramps up.
      accel:
        type: float32
        unit: rad/s^2
        doc: Electrical acceleration after the ramp.
      vel:
        type: float32
        unit: rad/s
        doc: Electrical velocity at which the lock-in stops accelerating.
      finish_distance:
        type: float32
        unit: rad
        doc: Electrical angle after which the lock-in ends, when `finish_on_distance` is set.
      finish_on_vel: {type: bool, doc: End the lock-in on reaching `vel`.}
      finish_on_distance: {type: bool, doc: End the lock-in after `finish_distance`.}
      finish_on_enc_idx: {type: bool, doc: End the lock-in when the encoder index is found.}

  ODrive.Axis.CanConfig:
    c_is_class: False
    attributes:
      node_id: {type: uint32, doc: "The board's CAN node ID: 0 to 63 with standard IDs, different on every board on a bus. Default 0."}
      is_extended: {type: bool, doc: Use 29-bit extended IDs instead of 11-bit standard IDs (default false).}
      heartbeat_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Heartbeat message (0x001); 0 turns it off. Default 100.}
      encoder_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Encoder Estimates message (0x009); 0 turns it off. Default 10.}
      motor_error_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Motor Error message (0x003); 0 (the default) turns it off.}
      encoder_error_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Encoder Error message (0x004); 0 (the default) turns it off.}
      controller_error_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Controller Error message (0x01D); 0 (the default) turns it off.}
      sensorless_error_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Sensorless Error message (0x005); 0 (the default) turns it off.}
      encoder_count_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Encoder Count message (0x00A); 0 (the default) turns it off.}
      iq_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Iq message (0x014); 0 (the default) turns it off.}
      sensorless_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Sensorless Estimates message (0x015); 0 (the default) turns it off.}
      bus_vi_rate_ms: {type: uint32, unit: ms, doc: Period of the cyclic Get Bus Voltage and Current message (0x017); 0 (the default) turns it off.}
      impedance_pos_range: {type: float32, unit: turn, doc: "Full scale (+/-) of the position fields of the CAN impedance command and reply (0x01E, 16 bit). Positions beyond it saturate. Default 16."}
      impedance_vel_range: {type: float32, unit: turn/s, doc: "Full scale (+/-) of the velocity fields of the impedance command and reply (12 bit). Default 32."}
      impedance_kp_max: {type: float32, unit: N·m/turn, doc: "Full scale of the impedance command's kp field (12 bit, 0 to max). Default 200."}
      impedance_kd_max: {type: float32, unit: N·m/(turn/s), doc: "Full scale of the impedance command's kd field (12 bit, 0 to max). Default 2."}
      impedance_torque_range: {type: float32, unit: N·m, doc: "Full scale (+/-) of the torque fields of the impedance command and reply (12 bit). Default 4."}

  ODrive.ThermistorCurrentLimiter:
    c_is_class: False

  ODrive.OnboardThermistorCurrentLimiter:
    c_is_class: True
    attributes:
      temperature:
        type: readonly float32
        unit: °C
        doc: Temperature of the power stage, from the onboard FET thermistor.
      config:
        c_is_class: False
        attributes:
          temp_limit_lower: 
            type: float32
            doc: The lower limit when the controller starts limiting current.
          temp_limit_upper: 
            type: float32
            doc: The upper limit when current limit reaches 0 Amps and an over temperature error is triggered.
          enabled: {type: bool, doc: Whether this thermistor is enabled. }

  ODrive.OffboardThermistorCurrentLimiter:
    c_is_class: True
    attributes:
      temperature:
        type: readonly float32
        unit: °C
        doc: Temperature from a motor thermistor on an analog GPIO, when enabled.
      config:
        c_is_class: False
        attributes:
          gpio_pin: {type: uint16, c_setter: set_gpio_pin, doc: "The analog GPIO the thermistor divider connects to; it must be in `GPIO_MODE_ANALOG_IN`."}
          poly_coefficient_0: {type: float32, c_name: 'thermistor_poly_coeffs[0]', doc: "Temperature = c0 x^3 + c1 x^2 + c2 x + c3, where x is the GPIO voltage as a fraction of 3.3 V. This is c0."}
          poly_coefficient_1: {type: float32, c_name: 'thermistor_poly_coeffs[1]', doc: c1 of the polynomial above.}
          poly_coefficient_2: {type: float32, c_name: 'thermistor_poly_coeffs[2]', doc: c2 of the polynomial above.}
          poly_coefficient_3: {type: float32, c_name: 'thermistor_poly_coeffs[3]', doc: c3 of the polynomial above.}
          temp_limit_lower: 
            type: float32
            doc: The lower limit when the controller starts limiting current.
          temp_limit_upper: 
            type: float32
            doc: The upper limit when current limit reaches 0 Amps and an over temperature error is triggered.
          enabled: {type: bool, doc: Whether this thermistor is enabled. }

  ODrive.Motor:
    c_is_class: True
    attributes:
      last_error_time: {type: float32, unit: s, doc: Time since boot of the motor's last error.}
      error:
        doc: "The motor's errors (bits in `Motor.Error`, 64 bits wide: CAN endpoint access can't read it; use Get Motor Error, 0x003)."
        nullflag: NONE
        flags:
          PHASE_RESISTANCE_OUT_OF_RANGE:
            brief: The measured motor phase resistance is outside of the plausible range.
            doc: |
              During calibration the motor resistance and
              [inductance](https://en.wikipedia.org/wiki/Inductance) is measured.
              If the measured motor resistance or inductance falls outside a set
              range this error will be returned. Check that all motor leads are
              connected securely.

              The measured values are in `config.phase_resistance` and
              `config.phase_inductance`.
              Small or gimbal motors can measure far outside the expected range:
              raise `config.resistance_calib_max_voltage` (default 2 V) or lower
              `config.calibration_current` (default 10 A), then calibrate again.

              In general, the calibration needs `resistance_calib_max_voltage` above
              `calibration_current` x `phase_resistance` and below half of `vbus_voltage`.
          PHASE_INDUCTANCE_OUT_OF_RANGE:
            brief: The measured motor phase inductance is outside of the plausible range.
            doc: |
              See `PHASE_RESISTANCE_OUT_OF_RANGE` for details.
          DRV_FAULT:
            bit: 3
            brief: The gate driver chip reported an error.
            doc: |
              The DRV8301 reported a fault (for example gate-drive undervoltage or
              overcurrent), and the motor disarmed. `axis0.last_drv_fault` holds the
              fault word from that moment.
          CONTROL_DEADLINE_MISSED:
            doc: The control loop didn't finish within its 125 µs period. A debugger halt causes it too.
          MODULATION_MAGNITUDE:
            bit: 7
            doc: |
              The bus voltage was insufficent to push the requested current
              through the motor.
              If you are getting this during motor calibration, make sure that
              `config.resistance_calib_max_voltage` is no more than half
              your bus voltage.

              For gimbal motors, set `config.calibration_current` and
              `config.current_lim` (volts for a gimbal motor) to half the bus
              voltage or less.
          CURRENT_SENSE_SATURATION:
            bit: 10
            doc: |
              The current sense circuit saturated the current sense amplifier.
              This can be caused by setting `config.current_lim` higher than
              `config.requested_current_range`. If this happens, increase the
              requested current range, save the configuration, and reboot the controller.
          CURRENT_LIMIT_VIOLATION:
            bit: 12
            doc: |
              The motor current exceeded `motor.config.current_lim + motor.config.current_lim_margin`.
              The current controller is a PI controller, so it can experience overshoot. The PI gains
              are automatically calculated based on `config.current_control_bandwidth` and the
              motor resistance and inductance (pole placement). Some overshoot is normal, so a sensible
              solution is to increase the current limit margin if your current limit is large.
          MODULATION_IS_NAN: {bit: 16, doc: The current controller computed a PWM duty cycle that was not a number.}
          MOTOR_THERMISTOR_OVER_TEMP: {doc: The motor thermistor measured a temperature above motor.motor_thermistor.config.temp_limit_upper}
          FET_THERMISTOR_OVER_TEMP: {doc: The inverter thermistor measured a temperature above motor.fet_thermistor.config.temp_limit_upper}
          TIMER_UPDATE_MISSED: {doc: A timer update event was missed. Perhaps the previous timer update took too much time. This is not expected in official release firmware.}
          CURRENT_MEASUREMENT_UNAVAILABLE: {doc: The phase current measurement is not available. The ADC failed to sample the current sensor in time. This is not expected in official release firmware.}
          CONTROLLER_FAILED: {doc: The motor was disarmed because the underlying controller failed. Usually this is the FOC controller.}
          I_BUS_OUT_OF_RANGE:
            doc: |
              The DC current sourced/sunk by this motor exceeded the configured
              hard limits. More specifically `I_bus` fell outside of the range
              `config.I_bus_hard_min` ... `config.I_bus_hard_max`.
          BRAKE_RESISTOR_DISARMED:
            doc: |
              An attempt was made to run the motor PWM while the brake resistor was configured as enabled
              (`config.enable_brake_resistor`) but disarmed.

              The most common cause: `config.enable_brake_resistor` was set to `True` without a save and reboot.

              Otherwise a system-wide error disarmed the brake resistor; the board's `error` shows it
              (`tools/dump_board.py` decodes it). A reboot or `clear_errors()` re-arms the brake resistor.
          SYSTEM_LEVEL:
            doc: |
              The motor had to be disarmed because of a system level error.
              See `ODrive:error` for more details.
          BAD_TIMING: {doc: The main control loop got out of sync with the motor control loop. This could indicate that the main control loop got stuck.}
          UNKNOWN_PHASE_ESTIMATE: {doc: The current controller did not get a valid angle input. Maybe you didn't calibrate the encoder.}
          UNKNOWN_PHASE_VEL: {doc: The motor controller did not get a valid phase velocity input.}
          UNKNOWN_TORQUE: {doc: The motor controller did not get a valid torque input.}
          UNKNOWN_CURRENT_COMMAND: {doc: The current controller did not get a valid current setpoint. Maybe you didn't configure the controller correctly.}
          UNKNOWN_CURRENT_MEASUREMENT: {doc: The current controller did not get a valid current measurement.}
          UNKNOWN_VBUS_VOLTAGE: {doc: 'The current controller did not get a valid `ODrive:vbus_voltage` measurement.'}
          UNKNOWN_VOLTAGE_COMMAND: {doc: The current controller did not get a valid feedforward voltage setpoint.}
          UNKNOWN_GAINS: {doc: The current controller gains were not configured. Run motor calibration or set `config.phase_resistance` and `config.phase_inductance` manually.}
          CONTROLLER_INITIALIZING: {doc: Internal value used while the controller is not yet ready to generate PWM timings.}
          UNBALANCED_PHASES: {doc: The motor phases are not balanced.}
      is_armed: {type: readonly bool, doc: True while the gate driver switches the motor's phases.}
      is_calibrated: {type: readonly bool, doc: True once phase resistance and inductance are known (measured, or `config.pre_calibrated`).}
      current_meas_phA: {type: readonly float32, unit: A, c_getter: 'current_meas_.value_or(Iph_ABC_t{0.0f, 0.0f, 0.0f}).phA', doc: "Phase A current; the Mini has no phase A shunt, so this is -(B + C)."}
      current_meas_phB: {type: readonly float32, unit: A, c_getter: 'current_meas_.value_or(Iph_ABC_t{0.0f, 0.0f, 0.0f}).phB', doc: Phase B current, measured.}
      current_meas_phC: {type: readonly float32, unit: A, c_getter: 'current_meas_.value_or(Iph_ABC_t{0.0f, 0.0f, 0.0f}).phC', doc: Phase C current, measured.}
      DC_calib_phA: {type: float32, unit: A, c_name: DC_calib_.phA, doc: Offset of the phase A current measurement, tracked at the top of each PWM period, when no current flows through the shunts.}
      DC_calib_phB: {type: float32, unit: A, c_name: DC_calib_.phB, doc: Offset of the phase B current measurement.}
      DC_calib_phC: {type: float32, unit: A, c_name: DC_calib_.phC, doc: Offset of the phase C current measurement.}
      I_bus: {type: readonly float32, unit: A, doc: The current in the ODrive DC bus.  This is also the current seen by the power supply in most systems.}
      phase_current_rev_gain: {type: float32, doc: "Inverse gain of the current sense amplifiers, set from `config.requested_current_range`."}
      effective_current_lim: 
        type: readonly float32
        unit: A
        doc: |
          This value is the internally-limited value of phase current allowed according to the set current limit and the FET and Motor thermistor limits.
      max_allowed_current:
        type: readonly float32
        unit: A
        doc: |
          Indicates the maximum current that can be measured by the current
          sensors in the current hardware configuration. This value depends on
          `config.requested_current_range`.
      max_dc_calib: {type: readonly float32, unit: A, doc: "Largest current-measurement offset accepted as valid: 10 % of `max_allowed_current`."}
      fet_thermistor: OnboardThermistorCurrentLimiter
      motor_thermistor: OffboardThermistorCurrentLimiter
      current_control:
        c_is_class: True
        attributes:
          p_gain: {type: readonly float32, unit: V/A, c_getter: 'pi_gains_.value_or(float2D{0.0f, 0.0f}).first', doc: "Proportional gain of the current loop: `current_control_bandwidth` x phase inductance."}
          i_gain: {type: readonly float32, unit: V/(A·s), c_getter: 'pi_gains_.value_or(float2D{0.0f, 0.0f}).second', doc: "Integral gain of the current loop: `current_control_bandwidth` x phase resistance."}
          I_measured_report_filter_k: {type: float32, doc: "Filter gain for the reported `Id_measured` and `Iq_measured` (1 = unfiltered). Affects only the reported values."}
          Id_setpoint: {type: readonly float32, unit: A, c_getter: 'Idq_setpoint_.value_or(float2D{0.0f, 0.0f}).first', doc: "d-axis current setpoint (non-zero with flux braking or the bus current soft limits)."}
          Iq_setpoint: {type: readonly float32, unit: A, c_getter: 'Idq_setpoint_.value_or(float2D{0.0f, 0.0f}).second', doc: q-axis (torque) current setpoint.}
          Vd_setpoint: {type: readonly float32, unit: V, c_getter: 'Vdq_setpoint_.value_or(float2D{0.0f, 0.0f}).first', doc: d-axis voltage feed-forward.}
          Vq_setpoint: {type: readonly float32, unit: V, c_getter: 'Vdq_setpoint_.value_or(float2D{0.0f, 0.0f}).second', doc: q-axis voltage feed-forward.}
          phase: {type: readonly float32, unit: rad, c_getter: 'phase_.value_or(0.0f)', doc: Electrical angle the current loop commutates at.}
          phase_vel: {type: readonly float32, unit: rad/s, c_getter: 'phase_vel_.value_or(0.0f)', doc: Electrical angular velocity.}
          Ialpha_measured: {type: readonly float32, unit: A, c_getter: 'Ialpha_beta_measured_.value_or(float2D{0.0f, 0.0f}).first', doc: Measured current in the stator's alpha axis.}
          Ibeta_measured: {type: readonly float32, unit: A, c_getter: 'Ialpha_beta_measured_.value_or(float2D{0.0f, 0.0f}).second', doc: Measured current in the stator's beta axis.}
          Id_measured: 
            type: readonly float32
            unit: A
            doc: |
              The phase current measured along the "d" axis in the FOC control loop.  This should be close to 0 for typical surface permanent magnet motors.
          Iq_measured: 
            type: readonly float32
            unit: A
            doc: |
              The phase current measured along the "q" axis in the FOC control loop.  This is the torque-generating current, so motor torque is approx. `torque_constant * Iq_measured`
          power: 
            type: readonly float32
            unit: W
            doc: |
              The electrical power being delivered to the motor
          v_current_control_integral_d: {type: float32, unit: V, doc: State of the d-axis current loop's integrator.}
          v_current_control_integral_q: {type: float32, unit: V, doc: State of the q-axis current loop's integrator.}
          final_v_alpha: {type: readonly float32, unit: V, doc: Output voltage in the alpha axis, after modulation limits.}
          final_v_beta: {type: readonly float32, unit: V, doc: Output voltage in the beta axis, after modulation limits.}
      n_evt_current_measurement: {type: readonly uint32, doc: Number of current measurement events since startup (modulo 2^32)}
      n_evt_pwm_update: {type: readonly uint32, doc: Number of PWM update events since startup (modulo 2^32)}
      spike_count: {type: readonly uint32, doc: "Diagnostics: control periods (while armed) in which the measured current vector jumped by more than spike_threshold from the previous period. A one-period glitch counts twice (out and back)."}
      spike_threshold: {type: float32, unit: A, doc: "Diagnostics (RAM only): jump threshold for `spike_count`."}

      config:
        c_is_class: False
        attributes:
          pre_calibrated: 
            type: bool
            c_setter: set_pre_calibrated
            doc: |
              Indicates to the ODrive that the parameters `config.phase_resistance` and `config.phase_inductance` are valid at system start.
              If these are valid and `pre_calibrated` is set to `True`, motor calibration can be skipped.
          pole_pairs: 
            type: int32
            doc: |
              The number of pole pairs in the motor.
              Note this is equal to 1/2 of the number of magnets (not coils!) in a typical hobby motor.
          calibration_current:
            type: float32
            doc: The current used to measure resistance during `AXIS_STATE_MOTOR_CALIBRATION`.
          resistance_calib_max_voltage: 
            type: float32
            doc: |
              The maximum voltage allowed during `AXIS_STATE_MOTOR_CALIBRATION`.
              This should be set to less than `(0.5 * vbus_voltage)`, but high enough to satisfy V=IR during motor calibration, where I is `config.calibration_current` and R is `config.phase_resistance`
          phase_inductance: {type: float32, unit: henry, c_setter: set_phase_inductance, doc: "Measured by `AXIS_STATE_MOTOR_CALIBRATION`; sets the current loop's gains."}
          phase_resistance: {type: float32, unit: ohm, c_setter: set_phase_resistance, doc: "Measured by `AXIS_STATE_MOTOR_CALIBRATION`; sets the current loop's gains."}
          torque_constant: {type: float32, unit: N·m/A, doc: "Torque per amp of q-axis current: 8.27 / KV (0.1074 for a 77 KV DJI 10018). The default, 0.04, makes every torque setting act 2.7 times stronger in amps on a 10018."}
          motor_type: {type: MotorType, doc: "`HIGH_CURRENT` (the default) for brushless motors driven by current control."}
          current_lim: 
            type: float32
            unit: A
            doc: Maximum commanded current allowed
          current_lim_margin: 
            type: float32
            unit: A
            doc: Measured current allowed above `current_lim`. Above `current_lim + current_lim_margin`, the motor disarms with `CURRENT_LIMIT_VIOLATION`.
          torque_lim: 
            type: float32
            unit: N·m
            doc: Maximum commanded torque allowed in the torque loop.
          inverter_temp_limit_lower: 
            type: float32
            unit: °C
            doc: Not implemented.
          inverter_temp_limit_upper: 
            type: float32
            unit: °C
            doc: Not implemented.
          requested_current_range:
            type: float32
            unit: A
            doc: |
              The minimum phase current range expected to be measured.  This is used to set the current shunt amplifier gains.
              Set it above `current_lim + current_lim_margin`, but as low as possible for resolution. At 20 A the measurement saturates at about 33.8 A. Takes effect after a save and reboot.
          current_control_bandwidth: 
            type: float32
            c_setter: set_current_control_bandwidth
            unit: rad/s
            doc: |
              Sets the PI gains of the Q and D axis FOC control according to `phase_resistance` and `phase_inductance` to create a critically-damped controller with a -3dB
              bandwidth at this frequency.
          acim_gain_min_flux: {type: float32, doc: AC induction motors only (untested on the Mini).}
          acim_autoflux_min_Id: {type: float32, unit: A, doc: AC induction motors only.}
          acim_autoflux_enable: {type: bool, doc: AC induction motors only.}
          acim_autoflux_attack_gain: {type: float32, doc: AC induction motors only.}
          acim_autoflux_decay_gain: {type: float32, doc: AC induction motors only.}
          R_wL_FF_enable: 
            type: bool
            doc: Enables automatic feedforward of the R*wL term in the current controller.
          bEMF_FF_enable: 
            type: bool
            doc: Enables automatic feedforward of the bEMF term in the current controller.
          I_bus_hard_min:
            type: float32
            unit: A
            doc: |
              If the controller fails to keep this motor's DC current (`ODrive.Motor:I_bus`)
              above this value the motor gets disarmed immediately. Most likely
              you want a negative value here. Set to -inf to disable. Take noise
              into account when choosing a value.
          I_bus_hard_max:
            type: float32
            unit: A
            doc: |
              If the controller fails to keep this motor's DC current (`ODrive.Motor:I_bus`)
              below this value the motor gets disarmed immediately. Usually this
              is set in conjunction with `I_bus_hard_min`. Set to inf to disable.
              Take noise into account when choosing a value.
          I_bus_soft_min:
            type: float32
            unit: A
            doc: |
              Lowest bus current (most regen) the motor aims for. Each control period the
              torque current is clamped so that the predicted bus current,
              1.5 * (R * (Id^2 + Iq^2) + back-EMF * Iq) / vbus, stays at or above this value.
              Values above 0 count as 0. Braking at speed is limited to what copper losses
              (including flux braking) and this regen allowance absorb. -inf (default) disables it.
          I_bus_soft_max:
            type: float32
            unit: A
            doc: |
              Highest bus current the motor aims for, by the same prediction as
              `I_bus_soft_min`; caps this board's draw from a shared supply. Values below 0 count
              as 0. inf (default) disables it.
          flux_brake_start_voltage:
            type: float32
            unit: V
            doc: |
              Flux braking: above this bus voltage the motor adds d-axis current
              Id = -flux_brake_gain * (vbus - start), up to the current limit, to burn bus energy in
              the windings (1.5 * R * Id^2). Set it a little above the supply voltage and below
              `dc_bus_overvoltage_trip_level`. inf (default) disables it.
          flux_brake_gain:
            type: float32
            unit: A/V
            doc: "Flux-braking d-axis current per volt above `flux_brake_start_voltage`."
          I_leak_max:
            type: float32
            unit: A
            doc: |
              In almost all scenarios, the currents on phase A, B and C should
              add up to zero. A small amount of measurement noise is expected.
              However if the sum of A, B, C currents exceeds this configuration
              value, the motor gets disarmed immediately.

              This check needs three current sensors; the Mini has two, so it has no effect there.
          dc_calib_tau: {type: float32, unit: s, doc: Time constant of the filter that tracks the current-measurement offsets.}
    functions:
      get_spike_n:
        in: {index: uint32}
        out: {n: uint32}
        doc: "Diagnostics: `n_evt_control_loop` at spike event `index` (0..31, ring buffer; event k is at k % 32)."
      get_spike_db:
        in: {index: uint32}
        out: {val: float32}
        doc: "Diagnostics: phase B current change [A] at spike event `index`."
      get_spike_dc:
        in: {index: uint32}
        out: {val: float32}
        doc: "Diagnostics: phase C current change [A] at spike event `index`."

  ODrive.Capture:
    c_is_class: True
    brief: "High-rate capture of up to 8 properties into RAM."
    doc: |
      Every `decimation` control periods (8 kHz), the control loop reads the chosen properties
      (`add_channel`, by endpoint ID) into a 32 KiB ring buffer. After the trigger, `post_trigger`
      more samples are recorded and the state becomes DONE. The host then reads the buffer from
      endpoint `readout_endpoint` with a chunked offset read: n_samples frames, oldest first, each
      n_channels little-endian 32-bit words holding the property's raw bytes zero-padded. The trigger
      sample is frame `trigger_index`. Settings are RAM only.
    attributes:
      decimation: {type: uint32, doc: "Record one sample every `decimation` control periods."}
      trigger_mode: {type: CaptureTrigger, doc: "What starts the post-trigger recording: `IMMEDIATE`, a `RISING` or `FALLING` level crossing, or `MANUAL` (`trigger()`)."}
      trigger_channel: {type: uint32, doc: "Channel (in add_channel order) watched by the RISING and FALLING triggers."}
      trigger_level: {type: float32, doc: "Level for the RISING and FALLING triggers, in the channel's own unit."}
      post_trigger: {type: uint32, doc: "Samples recorded after the trigger sample; start() clamps it to capacity - 1."}
      state: {type: readonly CaptureState, doc: "`IDLE`, `ARMED`, `TRIGGERED` or `DONE`."}
      n_channels: {type: readonly uint32, doc: Channels added with `add_channel`.}
      capacity: {type: readonly uint32, doc: "Frames the buffer holds: 8192 / n_channels."}
      n_samples: {type: readonly uint32, doc: "Frames recorded (at most capacity)."}
      trigger_index: {type: readonly uint32, doc: "Frame of the trigger sample, in readout order. Valid when DONE."}
      readout_endpoint: {type: readonly uint16, doc: "Endpoint ID of the recorded buffer (0x7F00), read with a buffer read over USB or CAN endpoint access."}
    functions:
      add_channel:
        in: {endpoint_id: uint32}
        out: {ok: bool}
        doc: "Append a property (float32, bool, uint8, uint16, uint32 or int32) by endpoint ID. Fails while recording, for an unknown ID, a function or another type, and beyond 8 channels. Discards the recorded data."
      clear_channels:
        doc: "Remove all channels, stop any recording and discard the data."
      start:
        out: {ok: bool}
        doc: "Discard the data and record until the trigger plus post_trigger samples. Fails with no channels, an unknown trigger_mode, or a level trigger on a missing channel."
      trigger:
        doc: "Trigger the armed capture now (any trigger_mode)."
  
  ODrive.AcimEstimator:
    c_is_class: True
    attributes:
      rotor_flux: {type: readonly float32, unit: A, doc: estimated magnitude of the rotor flux}
      slip_vel:
        type: readonly float32
        unit: rad/s
        doc: Estimated slip between physical and electrical angular velocity.
        c_getter: slip_vel_.any().value_or(0.0f)
      phase_offset:
        type: readonly float32
        unit: rad
        doc: Estimated offset between physical and electrical angular position.
      stator_phase_vel:
        type: readonly float32
        unit: rad/s
        doc: Calculated setpoint for the electrical velocity.
        c_getter: stator_phase_vel_.any().value_or(0.0f)
      stator_phase:
        type: readonly float32
        unit: rad
        doc: Calculated setpoint for the electrical phase.
        c_getter: stator_phase_.any().value_or(0.0f)
      config:
        c_is_class: False
        attributes:
          slip_velocity: {type: float32, doc: AC induction motors only (untested on the Mini).}

  ODrive.Controller:
    c_is_class: True
    attributes:
      error: 
        doc: "The controller's errors (bits in `Controller.Error`)."
        nullflag: NONE
        flags:
          OVERSPEED:
            brief: Motor speed exceeded `config.vel_limit * config.vel_limit_tolerance` and `config.enable_overspeed_error` was enabled.
            doc: |
              Raise `config.vel_limit` (default 2 turn/s, 120 rpm) if the motor
              is meant to run faster. A sudden change of load can overshoot the
              limit even when no command exceeds it. `config.vel_limit_tolerance`
              (default 1.2) sets how far past the limit the speed can go;
              `config.enable_overspeed_error = False` turns the error off.
          INVALID_INPUT_MODE:
            brief: The `config.input_mode` setting was set to an invalid value. See InputMode for available values
            doc: |
              Input modes and control modes are separate concepts. A control mode sets the type of control to be used,
              like position, velocity, or torque control. Input modes modify the input given (`input_pos`, etc) to
              give desired behavior. For example, in position *control mode*, the position filter *input mode* will
              smooth out `input_pos` commands to give smoother motion.
          UNSTABLE_GAIN:
            doc: Not raised by this firmware.
          INVALID_ESTIMATE:
            bit: 5
            doc: Indicates the encoder estimation module declined to output a linear position or velocity value and the exception was caught.
          INVALID_CIRCULAR_RANGE:
            doc: Indicates the encoder estimation module declined to output a circular position value and the exception was caught.
          SPINOUT_DETECTED:
            doc: |
              The motor mechanical power and electrical power do not agree. This is usually
              caused by a slipping encoder or incorrect encoder offset calibration.
              Check that your encoder is not slipping on the motor. If using an Index pin, check
              that you are not getting false index pulses caused by noise. This can happen if you
              are using unshielded cable for the encoder signals.
          POS_LIMIT_VIOLATION:
            brief: "The position went beyond `config.pos_min`/`config.pos_max` by more than `config.pos_limit_margin`."
            doc: Checked only while armed in closed loop. Entering closed loop outside the limits also raises it.
          POS_FOLLOWING_ERROR:
            brief: "|pos_setpoint - pos_estimate| exceeded `config.max_pos_error` (position control)."
            doc: Catches jams, collisions and encoder slip. Checked only while armed in closed loop.
          VEL_FOLLOWING_ERROR:
            brief: "|vel_setpoint - vel_estimate| exceeded `config.max_vel_error` (velocity or position control)."
            doc: Checked only while armed in closed loop.
      last_error_time: {type: float32, unit: s, doc: Time since boot of the controller's last error.}
      input_pos:
        type: float32
        unit: turn
        c_setter: set_input_pos
        doc: |
          The commanded position, in `CONTROL_MODE_POSITION_CONTROL` and `CONTROL_MODE_IMPEDANCE_CONTROL`.
          Writing it also updates the step count.
          In `INPUT_MODE_TUNING`, this acts as a DC offset for the position sine wave.
      input_vel:
        type: float32
        unit: turn/s
        doc: |
          In `CONTROL_MODE_VELOCITY_CONTROL`, sets the desired velocity of the axis.
          In `CONTROL_MODE_POSITION_CONTROL`, sets the feed-forward velocity of the velocity controller
          In `INPUT_MODE_TUNING`, this acts as a DC offset for the velocity sine wave.
      input_torque:
        type: float32
        unit: N·m
        doc: |
          In `CONTROL_MODE_TORQUE_CONTROL`, sets the desired output torque of the axis.
          In `CONTROL_MODE_VELOCITY_CONTROL`, `CONTROL_MODE_POSITION_CONTROL` and `CONTROL_MODE_IMPEDANCE_CONTROL`, sets the feed-forward torque of the torque controller,
          in every input mode: `INPUT_MODE_VEL_RAMP`, `INPUT_MODE_POS_FILTER` and `INPUT_MODE_TRAP_TRAJ` add it to their `config.inertia` term.
          In `INPUT_MODE_TUNING`, this acts as a DC offset for the torque sine wave.
      input_kp:
        type: float32
        unit: N·m/turn
        doc: |
          Stiffness in `CONTROL_MODE_IMPEDANCE_CONTROL`. RAM only; also set by the CAN impedance command.
      input_kd:
        type: float32
        unit: N·m/(turn/s)
        doc: |
          Damping in `CONTROL_MODE_IMPEDANCE_CONTROL`. RAM only; also set by the CAN impedance command.
      pos_setpoint:
        type: readonly float32
        unit: turn
        doc: The position reference actually being used by the position controller.  This is the same as `input_pos` in `INPUT_MODE_PASSTHROUGH`, but may vary according to `InputMode`.
      vel_setpoint:
        type: readonly float32
        unit: turn/s
        doc: The velocity reference actually being used by the velocity controller.  This is the same as `input_vel` in `INPUT_MODE_PASSTHROUGH`, but may vary according to `InputMode`.
      torque_setpoint: 
        type: readonly float32
        unit: N·m
        doc: The torque reference actually being used by the torque controller.  This is the same as `input_torque` in `INPUT_MODE_PASSTHROUGH`, but may vary according to `InputMode`.
      trajectory_done: 
        type: readonly bool
        doc: Indicates the last commanded Trapezoidal Trajectory movement is complete.
      timeout_active:
        type: readonly bool
        doc: |
          The axis watchdog expired with `axis.config.watchdog_action = DECEL_HOLD`. The controller
          decelerates to a stop at `axis.config.watchdog_decel`, holds that position and ignores new inputs.
          Ends on `clear_errors()` (feed the watchdog first) or on a new entry into closed loop; the inputs
          are then set to the hold position.
      vel_integrator_torque: 
        type: float32
        unit: N·m
        doc: The accumulated value of the velocity loop integrator
      anticogging_valid: {type: bool, doc: True once an anticogging map is recorded or loaded (untested on the Mini).}
      autotuning_phase: 
        type: float32
        unit: rad
        doc: The current phase angle of the `INPUT_MODE_TUNING` sine wave generator
      config:
        c_is_class: False
        attributes:
          gain_scheduling_width: {type: float32, unit: turn, doc: "Position error below which gain scheduling scales the gains down (`enable_gain_scheduling`)."}
          enable_vel_limit: {type: bool, doc: "Clamp the velocity setpoint to `vel_limit` (default true)."}
          enable_torque_mode_vel_limit:
            type: bool
            doc: Enable velocity limit in torque control mode (requires a valid velocity estimator).
          enable_gain_scheduling: 
            type: bool
            doc: |
              Enable the experimental "gain scheduling" module, which reduces the `pos_gain`, `vel_gain`, and `vel_integrator_gain` according to the position error.
              Also known as "anti-hunt"
          enable_overspeed_error: 
            type: bool
            doc: Enables the velocity controller's overspeed error
          control_mode: {type: ControlMode, c_setter: set_control_mode, doc: "Which loops run: torque, velocity, position (the default) or impedance control. [Control](control.md) describes each."}
          input_mode: {type: InputMode, doc: "How `input_pos`, `input_vel` and `input_torque` become setpoints. Default: `PASSTHROUGH`."}
          pos_gain:
            type: float32
            unit: (turn/s) / turn
            doc: units = (turn/s) / turn
          vel_gain:
            type: float32
            unit: N·m / (turn/s)
            doc: units = N·m / (turn/s)
          vel_integrator_gain:
            type: float32
            unit: N·m / (turn/s * s)
            doc: units = N·m / (turn/s * s)
          vel_integrator_limit:
            type: float32
            unit: N·m
            doc: Limit the integrator output (independent of proportional gain output). Set to infinity to disable. Units = N·m
          vel_limit:
            type: float32
            unit: turn/s
            doc: Infinity to disable.
          vel_limit_tolerance:
            type: float32
            doc: Ratio to `vel_limit`. Infinity to disable.
          vel_ramp_rate:
            type: float32
            unit: turn/s^2
            doc: "Rate at which `INPUT_MODE_VEL_RAMP` moves the velocity setpoint toward `input_vel`."
          torque_ramp_rate:
            type: float32
            unit: N·m / sec
            doc: "Rate at which `INPUT_MODE_TORQUE_RAMP` moves the torque setpoint toward `input_torque`."
          circular_setpoints:
            type: bool
            doc: "Keep the position setpoint within [0, `circular_setpoint_range`) and control against `encoder.pos_circular`, for continuous rotation. Step/direction input needs it."
          circular_setpoint_range:
            type: float32
            doc: circular range in [turns] for position setpoints when circular_setpoints is True
          steps_per_circular_range:
            type: int32
            doc: Number of steps within the circular setpoint range. Set this and the circular setpoint range to powers of 2 for the best results.
            c_setter: set_steps_per_circular_range
          homing_speed:
            type: float32
            unit: turn/s
            doc: The speed at which the axis moves towards the `min_endstop` during `AXIS_STATE_HOMING`
          inertia:
            type: float32
            unit: N·m/(turn/s^2)
            doc: "Torque feed-forward per unit of planned acceleration in `VEL_RAMP`, `POS_FILTER` and `TRAP_TRAJ`; `input_torque` adds to it."
          input_filter_bandwidth:
            type: float32
            unit: rad/s
            c_setter: set_input_filter_bandwidth
            brief: The desired bandwidth for `INPUT_MODE_POS_FILTER`.
            doc: Sets the position filter's P and I gains to emulate a critically-damped 2nd order mass-spring-damper motion.
          anticogging:
            c_is_class: False
            attributes:
              index: {type: readonly uint32, doc: Map entry the anticogging calibration is at.}
              pre_calibrated: {type: bool, doc: Keep the anticogging map across reboots (saved with the config).}
              calib_anticogging: {type: readonly bool, doc: True while the anticogging calibration runs.}
              calib_pos_threshold: {type: float32, doc: Position error under which the calibration moves to the next map entry.}
              calib_vel_threshold: {type: float32, doc: Velocity under which the calibration moves to the next map entry.}
              cogging_ratio: {type: readonly float32, doc: Scale between the encoder's counts and the map's entries.}
              anticogging_enabled: {type: bool, doc: Add the anticogging map's torque in closed loop (untested on the Mini).}
          mechanical_power_bandwidth:
            type: float32
            doc: "Bandwidth for mechanical power estimate. Used for spinout detection"
            unit: rad/s
          electrical_power_bandwidth:
            type: float32
            doc: "Bandwidth for electrical power estimate. Used for spinout detection. Dot product of Vdq and Idq"
            unit: rad/s
          spinout_mechanical_power_threshold:
            type: float32
            doc: "Mechanical power threshold for spinout detection. This should be a negative value"
            unit: Watt
          spinout_electrical_power_threshold:
            type: float32
            doc: "Electrical power threshold for spinout detection. This should be a positive value"
            unit: Watt
          pos_min:
            type: float32
            unit: turn
            doc: "Soft limit. Trap-trajectory targets and the position setpoint are clamped to [`pos_min`, `pos_max`]. -inf (the default) disables it."
          pos_max:
            type: float32
            unit: turn
            doc: "Soft limit, see `pos_min`. inf (the default) disables it."
          pos_limit_margin:
            type: float32
            unit: turn
            doc: "`POS_LIMIT_VIOLATION` when the position estimate is beyond a limit by more than this. Default 0.1."
          max_pos_error:
            type: float32
            unit: turn
            doc: "`POS_FOLLOWING_ERROR` threshold. inf (the default) disables it."
          max_vel_error:
            type: float32
            unit: turn/s
            doc: "`VEL_FOLLOWING_ERROR` threshold. inf (the default) disables it."
      autotuning:
        c_is_class: False
        doc: Automatically generate sine waves for frequency-domain response tuning
        attributes:
          frequency: {type: float32, unit: Hz, doc: "Frequency of the `INPUT_MODE_TUNING` sine wave."}
          pos_amplitude: {type: float32, unit: turns, doc: Amplitude of the position sine.}
          vel_amplitude: {type: float32, unit: turns/sec, doc: Amplitude of the velocity sine.}
          torque_amplitude: {type: float32, unit: N·m, doc: Amplitude of the torque sine.}
      mechanical_power:
        type: readonly float32
        unit: Watt
        doc: "Mechanical power estimate. Torque * velocity"
      electrical_power:
        type: readonly float32
        unit: Watt
        doc: "Electrical power estimate. Vdq·Idq"
    functions:
      move_incremental:
        doc: Moves the axes' goal point by a specified increment.
        in:
          displacement: {type: float32, doc: The desired position change.}
          from_input_pos: {type: bool, doc:
            'If true, the increment is applied relative to `input_pos`.
            If false, the increment is applied relative to `pos_setpoint`, which
            usually corresponds roughly to the current position of the axis.'
          }
      start_anticogging_calibration:
        doc: Starts recording the anticogging map (ODrive's procedure, untested on the Mini).
      remove_anticogging_bias: {out: {val: float32}, doc: Subtracts the map's mean from every entry and returns the mean.}
      get_anticogging_value: {in: {index: uint32}, out: {val: float32}, doc: One entry of the anticogging map.}


  ODrive.Encoder:
    c_is_class: True
    attributes:
      error:
        doc: "The encoder's errors (bits in `Encoder.Error`)."
        nullflag: NONE
        flags:
          UNSTABLE_GAIN:
            doc: "`config.bandwidth` is too high for the 8 kHz loop (4000 rad/s or more)."
          CPR_POLEPAIRS_MISMATCH:
            doc: |
              During offset calibration the encoder moved a different distance than
              `config.cpr` and the motor's `pole_pairs` predict, by more than
              `config.calib_range`. Check both values (the onboard AS5047: cpr 16384;
              pole pairs: magnets / 2). A rotor that stalls or slips during the scan
              (too little `calibration_current`, cogging, or a load) causes it too:
              raise `config.calib_scan_distance` (up to 4 times the default) or the
              calibration current. For an incremental encoder, CPR is 4 times its
              pulses per revolution.
          NO_RESPONSE:
            doc: |
              Check the encoder's wiring and `config.mode`.
          UNSUPPORTED_ENCODER_MODE:
            doc: "`config.mode` has a value the firmware doesn't support."
          ILLEGAL_HALL_STATE:
            doc: |
              Hall effect encoder only have 6 valid states out of 8 (2^3) possible states.
              An invalid state can be caused by noise or a hardware fault. If you get this
              error and you are sure that your electrical connections are correct, add
              22nF capacitors between the encoder A,B,Z pins and ground to filter out noise.
          INDEX_NOT_FOUND_YET:
            doc: |
              Check that the encoder has an index pulse wired to Z (J5 pin 2 on the Mini).
          ABS_SPI_TIMEOUT:
            doc: Not raised by this firmware.
          ABS_SPI_COM_FAIL:
            doc: |
              Too many absolute-encoder samples were missing or dropped: `spi_error_rate`, a
              filtered rate, rose above 5 %. Frame checks (`config.abs_spi_check_parity`,
              `abs_spi_reject_error_flag`, `abs_spi_max_jump`) count dropped frames as missing,
              so a wrong parity setting for the chip causes it too.
          ABS_SPI_NOT_READY:
            doc: Not raised by this firmware.
          HALL_NOT_CALIBRATED_YET:
            doc: Hall encoder mode needs `AXIS_STATE_ENCODER_HALL_PHASE_CALIBRATION` first.
      is_ready: {type: readonly bool, doc: "True once the encoder's offset is known: after offset calibration, or at boot for a `pre_calibrated` absolute encoder on its first valid read."}
      index_found: {type: readonly bool, doc: True once the index search found the index pulse.}
      shadow_count: 
        type: readonly int32
        unit: counts
        doc: Raw linear count from the encoder.
      count_in_cpr: 
        type: readonly int32
        unit: counts
        doc: Raw circular count from the encoder on [0, cpr)
      interpolation: {type: readonly float32, doc: "Fraction of a count interpolated between encoder edges (`config.enable_phase_interpolation`)."}
      phase: {type: readonly float32, unit: rad, c_getter: phase_.any().value_or(0.0f), doc: Electrical angle used for commutation.}
      pos_estimate: 
        type: readonly float32
        c_getter: pos_estimate_.any().value_or(0.0f)
        unit: turns
        doc: Linear position estimate of the encoder, in turns.  Also known as "multi-turn" position.
      pos_estimate_counts:
        type: readonly float32
        unit: counts
        doc: Linear position estimate of the encoder, in counts.  Equal to `pos_estimate * config.cpr`
      pos_circular: 
        type: readonly float32
        c_getter: pos_circular_.any().value_or(0.0f)
        unit: turns
        doc: Circular position estimate of the encoder, as a decimal from [0, 1).  Also known as "single-turn" position.
      pos_cpr_counts:
        type: readonly float32
        unit: counts
        doc: Circular position estimate of the encoder, on the space [0, cpr).
      delta_pos_cpr_counts: 
        type: readonly float32
        unit: counts
        doc: Circular position delta of the encoder in the most recent loop. Primarily for debug purposes, it indicates much the encoder changed since the last time it was checked.
      hall_state: {type: readonly uint8, doc: The three hall inputs as bits (hall encoder mode).}
      vel_estimate: 
        type: readonly float32
        c_getter: vel_estimate_.any().value_or(0.0f)
        unit: turn/s
        doc: Estimate of the linear velocity of an axis in turn/s
      vel_estimate_counts: 
        type: readonly float32
        unit: counts/sec
        doc: Estimate of the linear velocity of an axis, in counts/s.
      calib_scan_response: {type: readonly float32, unit: counts, doc: Encoder movement measured during the last offset calibration scan.}
      pos_abs:
        type: int32
        doc: The last (valid) position from an absolute encoder, if used.
      spi_error_rate: {type: readonly float32, doc: "Filtered fraction of control periods without a valid absolute-encoder sample; above 0.05 raises `ABS_SPI_COM_FAIL`."}
      spi_frame_count: {type: readonly uint32, doc: "Absolute-encoder SPI frames received."}
      spi_error_flag_count: {type: readonly uint32, doc: "AMS frames with the error flag (bit 14) set."}
      spi_warning_flag_count: {type: readonly uint32, doc: "AMS frames with bit 15 set (AS5047U warning flag; AS5047P parity)."}
      spi_jump_count: {type: readonly uint32, doc: "Samples dropped because they jumped further than `config.abs_spi_max_jump`."}
      spi_last_frame: {type: readonly uint16, doc: "Last raw AMS SPI frame."}
      spi_parity_error_count: {type: readonly uint32, doc: "AMS frames with odd parity (meaningful for an AS5047P)."}
      pos_abs_raw: {type: readonly int32, doc: "Last good raw absolute position, before the correction table."}
      correction_rms: {type: readonly float32, unit: counts, doc: "RMS encoder error measured by the last correction calibration."}
      correction_peak: {type: readonly float32, unit: counts, doc: "Largest |error| measured by the last correction calibration."}
      correction_bins: {type: readonly uint32, doc: "Bins the last correction calibration covered in both directions (256 = all)."}
      config:
        c_is_class: False
        attributes:
          mode: {type: Mode, doc: "Encoder type. The onboard AS5047 is `SPI_ABS_AMS` (257); the default is `INCREMENTAL`."}
          use_index: 
            type: bool
            c_setter: set_use_index
            doc: Set this to `True` when using an encoder with an index pin to allow pre-calibration of the encoder and encoder index search.
          index_offset:
            type: float32
            doc: When the index is found, the linear position of the axis will be set to this value if `use_index_offset` is set to `True`.
          use_index_offset: 
            type: bool
            doc: Set this to `True` to have the axis set the linear position of the axis to `index_offset` when the index is found during encoder index search
          find_idx_on_lockin_only: 
            type: bool
            c_setter: set_find_idx_on_lockin_only
            doc: Look for the index pulse only during lock-in spin.
          abs_spi_cs_gpio_pin:
            type: uint16
            c_setter: set_abs_spi_cs_gpio_pin
            doc: "Chip-select GPIO of an SPI absolute encoder: 7 for the Mini's onboard AS5047, 6 for one on J4. The GPIO must be in `GPIO_MODE_DIGITAL`."
          abs_spi_max_jump:
            type: uint16
            unit: counts
            doc: "Drop an absolute-encoder sample further than this from the last good one (default 1024, 1/16 turn of the AS5047; 0 turns it off). Active after 16 good samples; a fourth sample in a row at the new position is accepted."
          correction_enabled:
            type: bool
            doc: "Add the correction table (`get_correction`, `set_correction`) to the raw absolute position. Default false; the correction calibration sets it."
          correction_scan_turns:
            type: float32
            unit: turns
            doc: "Mechanical turns each way for `AXIS_STATE_ENCODER_CORRECTION_CALIBRATION`. Default 1."
          correction_max_harmonic:
            type: uint8
            doc: "The correction calibration keeps harmonics 1 to N per turn of the measured error (default 12; 0 keeps the raw bins). Higher orders are cogging, not encoder error."
          abs_spi_check_parity:
            type: bool
            doc: "Drop AMS frames with odd parity (default false). For an AS5047P (bit 15 = even parity); an AS5047U has none."
          abs_spi_reject_error_flag:
            type: bool
            doc: "Drop AMS frames with the error flag set (default false). The flag stays set until the chip's ERRFL register is read."
          cpr: 
            type: int32
            doc: Counts per Revolution of the encoder.  This is 4x the Pulses per Revolution.
          phase_offset: {type: int32, unit: counts, doc: "Encoder count at the rotor's electrical zero, measured by offset calibration."}
          phase_offset_float: {type: float32, unit: counts, doc: "Fractional part of `phase_offset`."}
          direction: {type: int32, doc: "+1 or -1: whether the encoder counts up with the electrical angle. Measured by offset calibration."}
          pre_calibrated: {type: bool, c_setter: set_pre_calibrated, doc: "Keep the offset calibration across reboots. With an absolute encoder, the board is ready at boot without a calibration sweep."}
          enable_phase_interpolation: {type: bool, doc: Interpolate the commutation angle between encoder counts.}
          bandwidth:
            type: float32
            c_setter: set_bandwidth
            unit: rad/s
            doc: "Bandwidth of the PLL that estimates position and velocity. Commutation uses the raw count, so it affects only the position and velocity loops. Default 1000."
          calib_range:
            type: float32
            unit: turn
            doc: "Offset calibration fails with `CPR_POLEPAIRS_MISMATCH` when the measured movement differs from the expected by more than this fraction. Default 0.02."
          calib_scan_distance: 
            type: float32
            unit: rad (electrical)
            doc: |
              The distance the motor is turned during encoder offset calibration.
              This is in the electrical frame, so if you want a 7pp motor to turn 1 mechanical revolution, you would put `(7 * 2*pi)`
            default: 16pi rad
          calib_scan_omega: 
            type: float32
            unit: rad/s (electrical)
            doc: |
              The speed the motor turns during encoder offset calibration.
              This is in the electrical frame, so a 7pp motor rotating 1 mechanical revolution in 2 sec would be set to `(7 * 2*pi) / 2`
            default: 4pi rad/s
          ignore_illegal_hall_state: 
            type: bool
            doc: Ignore the error "Illegal Hall State"
          hall_polarity: {type: uint8, doc: Hall input polarity bits, set by the hall polarity calibration.}
          hall_polarity_calibrated: {type: bool, doc: True once the hall polarity calibration ran.}
          sincos_gpio_pin_sin:
            type: uint16
            doc: Analog sine signal of a sin/cos encoder. The corresponding GPIO must be in `GPIO_MODE_ANALOG_IN`.
          sincos_gpio_pin_cos:
            type: uint16
            doc: Analog cosine signal of a sin/cos encoder. The corresponding GPIO must be in `GPIO_MODE_ANALOG_IN`.
    functions:
      set_linear_count:
        in:
          count: 
            type: int32
            unit: counts
        doc: Set the current linear position of the axis, in counts
      get_correction: {in: {index: uint32}, out: {val: float32}, doc: "Correction table entry `index` (0 to 255), in counts."}
      set_correction: {in: {index: uint32, val: float32}, doc: "Sets correction table entry `index` (0 to 255), in counts. RAM only until saved."}


  ODrive.SensorlessEstimator:
    c_is_class: True
    attributes:
      error:
        doc: "The sensorless estimator's errors (bits in `SensorlessEstimator.Error`)."
        nullflag: NONE
        flags:
          UNSTABLE_GAIN:
            doc: "`config.pll_bandwidth` is too high for the 8 kHz loop."
          UNKNOWN_CURRENT_MEASUREMENT:
            doc: The estimator got no valid current measurement.
      phase: {type: readonly float32, unit: rad, c_getter: phase_.any().value_or(0.0f), doc: Estimated electrical angle.}
      pll_pos: {type: readonly float32, unit: rad, doc: Electrical angle tracked by the estimator's PLL.}
      phase_vel: {type: readonly float32, unit: rad/s, c_getter: phase_vel_.any().value_or(0.0f), doc: Estimated electrical angular velocity.}
      vel_estimate: {type: readonly float32, unit: turn/s, c_getter: vel_estimate_.any().value_or(0.0f), doc: Estimated mechanical velocity.}
      # pll_kp: float32
      # pll_ki: float32
      config:
        c_is_class: False
        attributes:
          observer_gain: {type: float32, doc: Gain of the flux observer (sensorless mode, untested on the Mini).}
          pll_bandwidth: {type: float32, unit: rad/s, doc: Bandwidth of the estimator's PLL.}
          pm_flux_linkage: {type: float32, unit: Wb, doc: "The motor's flux linkage: 5.51328895422 / (pole pairs x KV)."}


  ODrive.TrapezoidalTrajectory:
    c_is_class: True
    attributes:
      config:
        c_is_class: False
        attributes:
          vel_limit: {type: float32, unit: turn/s, doc: "Cruise speed of a trapezoidal move. Keep `controller.config.vel_limit` at least 10 % above it."}
          accel_limit: {type: float32, unit: turn/s^2, doc: Acceleration of a trapezoidal move.}
          decel_limit: {type: float32, unit: turn/s^2, doc: Deceleration of a trapezoidal move.}

  ODrive.Endstop:
    c_is_class: True
    attributes:
      endstop_state: {type: readonly bool, doc: True while the endstop is pressed (after debouncing).}
      config:
        c_is_class: False
        attributes:
          gpio_num: {type: uint16, c_setter: set_gpio_num, doc: The endstop's GPIO; it must be in a `GPIO_MODE_DIGITAL` mode.}
          enabled: {type: bool, c_setter: set_enabled, doc: Enables the endstop. Outside homing, a pressed endstop sets `MIN_ENDSTOP_PRESSED` or `MAX_ENDSTOP_PRESSED`.}
          offset: {type: float32, unit: turns, doc: Position the axis takes at the endstop after homing.}
          is_active_high: {type: bool, doc: True when the input reads high while pressed.}
          debounce_ms: {type: uint32, c_setter: set_debounce_ms, doc: Time the input must stay at a level before it counts.}

  ODrive.MechanicalBrake:
    c_is_class: True
    attributes:
      config:
        c_is_class: False
        attributes:
          gpio_num: {type: uint16, c_setter: set_gpio_num, doc: "GPIO that drives the brake; it must be in `GPIO_MODE_MECH_BRAKE`."}
          is_active_low: {type: bool, doc: True when a low output engages the brake.}
    functions:
      engage:
        doc: |
          This function engages the mechanical brake if one is present and enabled.
      release:
        doc: |
          This function releases the mechanical brake if one is present and enabled.

  ODrive.TaskTimer:
    c_is_class: True
    attributes:
      start_time: {type: readonly uint32, unit: ticks, doc: "Start of the task in the profiled control period, as a TIM13 timestamp in 168 MHz ticks. Recorded when `task_timers_armed` is set."}
      end_time: {type: readonly uint32, unit: ticks, doc: End of the task in the profiled control period.}
      length: {type: readonly uint32, unit: ticks, doc: "The task's duration in the profiled control period (168 ticks = 1 µs)."}
      max_length: {type: uint32, unit: ticks, doc: The task's longest duration since boot; write 0 to reset it.}

  ODrive3:
    c_is_class: True
    implements: ODrive
    attributes:
      config:
        c_is_class: False
        implements: ODrive.Config
        attributes:
          # TODO: add support for arrays
          gpio1_mode: {type: ODrive.GpioMode, doc: Mode of GPIO1 (changes take effect after reboot), c_name: 'gpio_modes[1]'}
          gpio2_mode: {type: ODrive.GpioMode, doc: Mode of GPIO2 (changes take effect after reboot), c_name: 'gpio_modes[2]'}
          gpio3_mode: {type: ODrive.GpioMode, doc: Mode of GPIO3 (changes take effect after reboot), c_name: 'gpio_modes[3]'}
          gpio4_mode: {type: ODrive.GpioMode, doc: Mode of GPIO4 (changes take effect after reboot), c_name: 'gpio_modes[4]'}
          gpio5_mode: {type: ODrive.GpioMode, doc: Mode of GPIO5 (changes take effect after reboot), c_name: 'gpio_modes[5]'}
          gpio6_mode: {type: ODrive.GpioMode, doc: Mode of GPIO6 (changes take effect after reboot), c_name: 'gpio_modes[6]'}
          gpio7_mode: {type: ODrive.GpioMode, doc: Mode of GPIO7 (changes take effect after reboot), c_name: 'gpio_modes[7]'}
          gpio8_mode: {type: ODrive.GpioMode, doc: Mode of GPIO8 (changes take effect after reboot), c_name: 'gpio_modes[8]'}
          gpio9_mode: {type: ODrive.GpioMode, doc: Mode of GPIO9 (changes take effect after reboot), c_name: 'gpio_modes[9]'}
          gpio10_mode: {type: ODrive.GpioMode, doc: Mode of GPIO10 (changes take effect after reboot), c_name: 'gpio_modes[10]'}
          gpio11_mode: {type: ODrive.GpioMode, doc: Mode of GPIO11 (changes take effect after reboot), c_name: 'gpio_modes[11]'}
          gpio12_mode: {type: ODrive.GpioMode, doc: Mode of GPIO12 (changes take effect after reboot), c_name: 'gpio_modes[12]'}
          gpio13_mode: {type: ODrive.GpioMode, doc: Mode of GPIO13 (changes take effect after reboot), c_name: 'gpio_modes[13]'}
          gpio14_mode: {type: ODrive.GpioMode, doc: Mode of GPIO14 (changes take effect after reboot), c_name: 'gpio_modes[14]'}
          gpio15_mode: {type: ODrive.GpioMode, doc: Mode of GPIO15 (changes take effect after reboot), c_name: 'gpio_modes[15]'}
          gpio16_mode: {type: ODrive.GpioMode, doc: Mode of GPIO16 (changes take effect after reboot), c_name: 'gpio_modes[16]'}

          gpio1_pwm_mapping: {type: ODrive.Endpoint, c_name: 'pwm_mappings[0]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_PWM`.}
          gpio2_pwm_mapping: {type: ODrive.Endpoint, c_name: 'pwm_mappings[1]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_PWM`.}
          gpio3_pwm_mapping: {type: ODrive.Endpoint, c_name: 'pwm_mappings[2]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_PWM`.}
          gpio4_pwm_mapping: {type: ODrive.Endpoint, c_name: 'pwm_mappings[3]', doc: Make sure the corresponding GPIO is in `GPIO_MODE_PWM`.}
      axis0: {type: ODrive.Axis, c_name: get_axis(0)}

valuetypes:
  ODrive.GpioMode:
    values:
      DIGITAL:
        doc: |
          The pin can be used for one or more of these functions:
          Step, dir, enable, encoder index, hall effect encoder, SPI encoder nCS (this one is exclusive).
      DIGITAL_PULL_UP:
        doc: Same as `DIGITAL` but with the internal pull-up resistor enabled.
      DIGITAL_PULL_DOWN:
        doc: Same as `DIGITAL` but with the internal pull-down resistor enabled.
      ANALOG_IN:
        doc: |
          The pin can be used for one or more of these functions:
          Sin/cos encoders, analog input, `get_adc_voltage()`.
      UART_A: {doc: See `config.enable_uart_a`.}
      UART_B: {doc: "See `config.enable_uart_b` (GPIO3 TX, GPIO4 RX)."}
      UART_C: {doc: This mode is not supported on ODrive v3.x.}
      CAN_A: {doc: See `config.enable_can_a`.}
      I2C_A: {doc: See `config.enable_i2c_a`.}
      SPI_A: {doc: The SPI pins are fixed in hardware on ODrive v3.x boards and the Mini, so this mode has no use there.}
      PWM: {doc: See `config.gpio1_pwm_mapping`.}
      ENC0: {doc: The pin is used by quadrature encoder 0.}
      ENC2: {value: 13, doc: This mode is not supported on ODrive v3.x.}
      MECH_BRAKE: {doc: "Drives an external mechanical brake (`axis0.mechanical_brake`)."}
      STATUS: {doc: The pin is used for status output (see `config.error_gpio_pin`)}

  ODrive.StreamProtocolType:
    values:
      Fibre:
        doc: |
          Machine-to-machine protocol which gives access to all features of the
          board. The host tools and the `xdrive` library speak it over USB.
      Ascii:
        doc: |
          Human-readable protocol for hosts that don't speak Fibre.
          Refer to [ODrive's ASCII protocol page](https://docs.odriverobotics.com/v/0.5.6/ascii-protocol.html) for details.
      Stdout: {doc: Output of printf(). Only intended for developers who modify
          ODrive firmware.}
      AsciiAndStdout: {doc: Combination of `Ascii` and `Stdout`.}

  ODrive.Capture.CaptureState:
    values:
      IDLE: {brief: No capture recorded (or the channels changed since).}
      ARMED: {brief: Recording and waiting for the trigger.}
      TRIGGERED: {brief: Recording the post_trigger samples.}
      DONE: {brief: Recording finished; the buffer can be read.}

  ODrive.Capture.CaptureTrigger:
    values:
      IMMEDIATE: {brief: Trigger on the first sample.}
      RISING: {brief: "Trigger when trigger_channel goes from below trigger_level to at or above it."}
      FALLING: {brief: "Trigger when trigger_channel goes from above trigger_level to at or below it."}
      MANUAL: {brief: Wait for trigger().}

  ODrive.Can.Protocol:
    flags: 
      SIMPLE:
        doc: "CANSimple, ODrive's CAN protocol, with this firmware's impedance command (0x01E) and endpoint access (0x01F)."

  ODrive.Axis.AxisState: # TODO: remove redundant "Axis" in name
    values:
      UNDEFINED:
        doc: No request. `requested_state` reads this once the state machine has taken a request.
      IDLE:
        brief: Disable motor PWM and do nothing.
      STARTUP_SEQUENCE:
        brief: Run the startup procedure.
        doc: "The `config.startup_*` flags choose the steps."
      FULL_CALIBRATION_SEQUENCE:
        doc: Run motor calibration and then encoder offset calibration (or encoder
          index search if `<axis>.encoder.config.use_index` is `True`).
      MOTOR_CALIBRATION:
        brief: Measure phase resistance and phase inductance of the motor.
        doc: |
          Writes `motor.config.phase_resistance` and `motor.config.phase_inductance`. Saved with
          `motor.config.pre_calibrated = True`, the results make this calibration unnecessary at the next boot.
      ENCODER_INDEX_SEARCH:
        brief: Turn the motor in one direction until the encoder index is traversed.
        doc: This state can only be entered if `encoder.config.use_index` is `True`.
        value: 6
      ENCODER_OFFSET_CALIBRATION:
        brief: Turn the motor in one direction for a few seconds and then back to measure the offset between the encoder position and the electrical phase.
        doc: |
          Needs a calibrated motor (`motor.is_calibrated`). Success sets `encoder.is_ready`.
      CLOSED_LOOP_CONTROL:
        brief: Run closed loop control.
        doc: |
          What runs depends on `controller.config.control_mode`. Needs a calibrated motor
          (`motor.is_calibrated`) and a ready encoder (`encoder.is_ready`). Entering it starts
          from rest: zero velocity and torque setpoints, no running trajectory.
      LOCKIN_SPIN:
        brief: Run lockin spin.
        doc: |
          Can only be entered if the motor is calibrated (`motor.is_calibrated`)
          or the motor direction is unspecified (`encoder.config.direction` == 1)
      ENCODER_DIR_FIND:
        brief: Run encoder direction search.
        doc: |
          Can only be entered if the motor is calibrated (`motor.is_calibrated`).
      HOMING:
        brief: Run axis homing function.
        doc:
          Endstops must be enabled to use this feature.
      ENCODER_HALL_POLARITY_CALIBRATION:
        brief: Rotate the motor in lockin and calibrate hall polarity
        doc:
          ODrive assumes 120 degree electrical hall spacing. This routine determines if that
          is the case and sets the polarity if the halls are on 60 degree electrical spacing
      ENCODER_HALL_PHASE_CALIBRATION:
        brief: Rotate the motor for 30s to calibrate hall sensor edge offsets
        doc:
          The phase offset is not calibrated at this time, so the map is only relative
      ENCODER_CORRECTION_CALIBRATION:
        brief: "Measure the absolute encoder's per-angle error and fill the encoder's correction table"
        doc:
          Turns an open-loop current vector (`motor.config.calibration_current`, `encoder.config.calib_scan_omega`) forward and back over
          `encoder.config.correction_scan_turns` mechanical turns. Needs a calibrated motor and a ready encoder.
          Run `ENCODER_OFFSET_CALIBRATION` again afterwards, then save.

  ODrive.Axis.WatchdogAction:
    values:
      DISARM:
        doc: "Set `AXIS_ERROR_WATCHDOG_TIMER_EXPIRED` and disarm (the motor goes limp): ODrive's behavior."
      DECEL_HOLD:
        doc: |
          Decelerate to a stop at `config.watchdog_decel`, then hold that position with torque capped at
          `config.watchdog_torque_lim`. Reported by `controller.timeout_active`, not as an error.
          Outside armed closed loop the watchdog disarms with an error as in DISARM.

  ODrive.Encoder.Mode:
    values:
      INCREMENTAL:
        doc: Quadrature encoder on J5 (A, B and an optional index Z).
      HALL:
        doc: Hall sensors on J5.
      SINCOS:
        doc: "Analog sine and cosine signals on two GPIOs (`config.sincos_gpio_pin_sin`, `sincos_gpio_pin_cos`)."
      SPI_ABS_CUI:
        value: 0x100
        doc: Compatible with CUI AMT23xx
      SPI_ABS_AMS:
        value: 0x101
        doc: "AMS AS5047P/U (the Mini's onboard encoder), AS5048A/AS5048B (no daisy chain support)."
      SPI_ABS_AEAT:
        value: 0x102
        doc: Supports AEAT-8800
      SPI_ABS_RLS:
        value: 0x103
        doc: Supports RLS Orbis Encoders
      SPI_ABS_MA732:
        value: 0x104
        doc: MagAlpha MA732 magnetic encoder

  ODrive.Controller.ControlMode:
    values:
      # Note: these should be sorted from lowest level of control to
      # highest level of control, to allow "<" style comparisons.
      VOLTAGE_CONTROL:
        doc: |
          Note: This mode is not used internally.  For voltage-only FOC, use `MotorType.GIMBAL`
      TORQUE_CONTROL:
        doc: |
          Uses only the inner torque control loop.
          Use `input_torque` to command desired torque.
          Note the setting `motor.config.torque_constant`.
          Note the setting `enable_torque_mode_vel_limit`.
      VELOCITY_CONTROL:
        doc: |
          Uses both the inner torque control loop and the velocity control loop.
          Use `input_vel` to command desired velocity, and `input_torque`.
      POSITION_CONTROL:
        doc: |
          Uses the inner torque loop, the velocity control loop, and the outer position control loop.
          Use `input_pos` to command desired position, `input_vel` to command velocity feed-forward, and `input_torque` for torque feed-forward.
      IMPEDANCE_CONTROL:
        doc: |
          A spring and damper toward the setpoint, computed every control period:
          torque = input_kp * (pos_setpoint - pos) + input_kd * (vel_setpoint - vel) + torque_setpoint.
          No velocity integrator, no position gain scheduling; a steady load deflects the axis by load / input_kp.
          input_kp = input_kd = 0 is torque control (without `enable_torque_mode_vel_limit`); input_kp = 0 damps only.
          Soft limits, following-error checks (the position check only while input_kp > 0, the velocity check only
          while input_kd > 0), the torque limits and the watchdog apply as in position control. A watchdog
          DECEL_HOLD holds with the position-control gains (`pos_gain`, `vel_gain`, `vel_integrator_gain`).

  ODrive.Controller.InputMode:
    values:
      INACTIVE:
        brief: Disable inputs. Setpoints retain their last value.
      PASSTHROUGH:
        brief: Pass `input_pos`, `input_vel` and `input_torque` through to the setpoints directly.
        doc: For every control mode; the usual mode for impedance control and for a host that streams a smooth trajectory.
      VEL_RAMP:
        brief: Ramps the velocity setpoint toward `input_vel` at `config.vel_ramp_rate`.
        doc: Velocity control. `config.inertia` times the ramp's acceleration, plus `input_torque`, is the torque feed-forward.
      POS_FILTER:
        brief: Smooths `input_pos` with a critically damped second-order filter.
        doc: |
          Position control. `config.input_filter_bandwidth` sets the filter; `config.inertia` times the
          filter's acceleration, plus `input_torque`, is the torque feed-forward. Step response:
          [Control](control.md#position-filter-3).
      MIX_CHANNELS:
        brief: Not implemented.
      TRAP_TRAJ:
        brief: Plans a trapezoidal move to each new `input_pos`.
        doc: |
          Position or impedance control. `axis0.trap_traj.config.vel_limit`, `accel_limit` and `decel_limit`
          shape the move; `config.inertia` times the planned acceleration, plus `input_torque`, is the torque
          feed-forward during the move, and `input_torque` alone after it. A move:
          [Control](control.md#trapezoidal-trajectory-5).
      TORQUE_RAMP:
        brief: Ramps the torque setpoint toward `input_torque` at `config.torque_ramp_rate`.
        doc: Torque control.
      TUNING:
        value: 8
        brief: Adds sine waves to the inputs, for frequency-response tuning.
        doc: |
          Set `control_mode` for the loop to tune and the `controller.autotuning` frequency and
          amplitudes; `input_pos`, `input_vel` and `input_torque` act as the sine waves' DC offsets.

  ODrive.Motor.MotorType:
    values:
      HIGH_CURRENT:
        doc: |
          Used for all standard "hobby-style" motors Permanant Magnet AC (PMAC) or Brushless DC (BLDC) motors.  This is the default.
          Note: Assumes sinusoidal back-EMF, "wye" connected motors.  Trapezoidal bEMF may have reduced controllability.
      #LowCurrent: # not implemented
      GIMBAL:
        value: 2
        doc: |
          Enables voltage-only FOC where V=IR can be assumed to be correct.
          Used for high-phase-resistance motors (> 1 ohm), which are typically sold as "Gimbal" motors.
      ACIM:
        doc: |
          Used for FOC control of AC Induction Motors (ACIM), aka Asynchronous motors, 
