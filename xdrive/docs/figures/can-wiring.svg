<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="sans-serif" font-size="13" fill="#1f2937">
  <title>Power and CAN ground for several Minis</title>
  <rect width="900" height="390" fill="#ffffff"/>

  <!-- supply and star point -->
  <rect x="40" y="50" width="150" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="115" y="83" text-anchor="middle">DC supply</text>
  <line x1="115" y1="106" x2="115" y2="163" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="115" cy="170" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="102" y="150" text-anchor="end" font-size="11">star point</text>

  <!-- DC+ -->
  <path d="M 150 50 V 24 H 660 V 50" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="440" y1="24" x2="440" y2="50" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="260" y="18" font-size="11" fill="#b91c1c">DC+</text>

  <!-- boards -->
  <rect x="380" y="50" width="130" height="56" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="445" y="83" text-anchor="middle">Mini 1</text>
  <rect x="600" y="50" width="130" height="56" rx="6" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="665" y="83" text-anchor="middle">Mini 2</text>

  <!-- DC- from star to each board -->
  <path d="M 122 168 H 480 V 106" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M 120 176 H 700 V 106" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <text x="135" y="196" font-size="11">DC−: one wire per board to the star point</text>

  <!-- CAN pair -->
  <line x1="410" y1="106" x2="410" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="422" y1="106" x2="422" y2="292" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 3"/>
  <line x1="630" y1="106" x2="630" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="642" y1="106" x2="642" y2="292" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 3"/>
  <line x1="300" y1="280" x2="800" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="292" x2="800" y2="292" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 3"/>
  <text x="810" y="284" font-size="11" fill="#2563eb">CAN_H</text>
  <text x="810" y="300" font-size="11" fill="#2563eb">CAN_L</text>
  <text x="740" y="130" font-size="11" fill="#4b5563">J3: CAN_L, CAN_H,</text>
  <text x="740" y="145" font-size="11" fill="#4b5563">no ground pin</text>

  <!-- adapter -->
  <rect x="160" y="260" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="284" text-anchor="middle">USB-CAN adapter</text>
  <text x="230" y="302" text-anchor="middle" font-size="11" fill="#4b5563">H, L, GND</text>
  <path d="M 190 260 V 225 H 115 V 177" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="20" y="240" font-size="11">adapter GND</text>
  <text x="20" y="254" font-size="11">to the star point</text>
  <rect x="160" y="330" width="140" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="357" text-anchor="middle">Host</text>
  <line x1="230" y1="316" x2="230" y2="330" stroke="#1f2937" stroke-width="2"/>
  <text x="330" y="340" font-size="11" fill="#4b5563">The transceivers need a shared ground reference. The adapter's GND wire</text>
  <text x="330" y="355" font-size="11" fill="#4b5563">is the only link to it, so it carries no motor current.</text>
</svg>
